<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Profile</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --subtle: #9ca3af;
            --input-bg: #f9fafb;
            --input-border: #d1d5db;
            --secondary-btn-bg: #f3f4f6;
            --secondary-btn-text: #374151;
            --secondary-btn-hover: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --subtle: #6b7280;
                --input-bg: #1f2937;
                --input-border: #374151;
                --secondary-btn-bg: #1f2937;
                --secondary-btn-text: #d1d5db;
                --secondary-btn-hover: #374151;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .container {
            max-width: 380px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            text-align: left;
        }
        .brand {
            font-size: 12px;
            font-weight: 700;
            color: var(--subtle);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
            text-align: center;
        }
        h2, h3 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.01em;
            text-align: center;
        }
        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            border: 1px solid var(--card-border);
            object-fit: cover;
            display: block;
        }
        input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            margin-bottom: 12px;
        }
        input:focus {
            border-color: var(--text);
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .secondary-btn {
            width: 100%;
            background-color: var(--secondary-btn-bg);
            color: var(--secondary-btn-text);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .secondary-btn:hover {
            background-color: var(--secondary-btn-hover);
        }
        .danger-btn {
            width: 100%;
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .danger-btn:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--card-border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .premium-diamond-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #a855f7;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.15);
            margin-bottom: 8px;
        }
        .diamond-icon {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            display: inline-block;
        }
        footer {
            font-size: 11px;
            color: var(--subtle);
        }
    </style>
</head>
<body>

    <div style="height: 16px;"></div>

    <div id="loading-screen" class="container">
        <p class="brand notranslate">Kinship</p>
        <div class="spinner"></div>
        <p id="prof-loading-text" style="font-size: 12px; color: var(--muted); text-align: center;">Checking region & profile...</p>
    </div>

    <div id="profile-screen" class="container card hidden" style="text-align: center;">
        <img id="user-avatar" src="" alt="Avatar" class="avatar">
        <h2 id="profile-nickname" style="margin-bottom: 6px;"></h2>
        <div id="role-badge-container"></div>
        <p id="user-email" style="font-size: 12px; color: var(--muted); margin-bottom: 8px;"></p>
        <p id="prof-synced-text" style="font-size: 12px; color: #10b981; font-weight: 600; margin-bottom: 24px;">Synced with cloud ✓</p>

        <div style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
            <button id="set-password-btn" class="secondary-btn" style="display: none;">Set Password</button>
            <button id="logout-btn" class="secondary-btn">Log Out</button>
            <button id="delete-account-btn" class="danger-btn">Delete Account</button>
        </div>
    </div>

    <div id="set-password-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;">
        <div class="card" style="max-width: 320px; width: 100%;">
            <h3 id="set-pass-title" style="font-size: 15px; margin-bottom: 6px;">Set Password</h3>
            <p id="set-pass-sub" style="font-size: 11px; color: var(--muted); margin-bottom: 16px; text-align: center;">Protect your account with a secure password</p>

            <label id="new-pass-label">New Password</label>
            <input id="input-new-pass" type="password" placeholder="Enter password">

            <label id="new-pass-confirm-label">Repeat Password</label>
            <input id="input-new-pass-confirm" type="password" placeholder="Repeat password">

            <p id="set-pass-error" class="hidden" style="font-size: 11px; color: #ef4444; margin-bottom: 12px; text-align: center; font-weight: 600;"></p>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button id="save-password-btn" class="secondary-btn" style="background: var(--text); color: var(--bg);">Save Password</button>
                <button id="cancel-set-pass-btn" onclick="closeSetPasswordModal()" style="background: none; border: none; color: var(--subtle); font-size: 11px; cursor: pointer; padding: 6px; text-align: center; width: 100%;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="delete-warning-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;">
        <div class="card" style="max-width: 320px; width: 100%;">
            <h3 id="del-warn-title" style="font-size: 14px; margin-bottom: 10px;">Delete Account</h3>
            <p id="del-warn-body" style="font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 16px;"></p>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
                <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 11px; color: var(--text); cursor: pointer;">
                    <input id="chk-downloaded" type="checkbox" style="margin-top: 2px; width: auto;">
                    <span id="chk-downloaded-text">I have downloaded my account data</span>
                </label>
                <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 11px; color: var(--text); cursor: pointer;">
                    <input id="chk-confirm" type="checkbox" style="margin-top: 2px; width: auto;">
                    <span id="chk-confirm-text">I confirm permanent account deletion</span>
                </label>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button id="download-data-btn" class="secondary-btn" style="font-size: 11px; padding: 10px;">Download Data</button>
                <button id="proceed-delete-btn" disabled class="danger-btn" style="opacity: 0.5; cursor: not-allowed; font-size: 11px; padding: 10px;">Delete Account</button>
                <button id="cancel-del-warn-btn" onclick="closeDeleteModal()" style="background: none; border: none; color: var(--subtle); font-size: 11px; cursor: pointer; padding: 6px; text-align: center; width: 100%;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="delete-verify-account-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;">
        <div class="card" style="max-width: 320px; width: 100%; text-align: center;">
            <h3 id="del-verify-title" style="font-size: 14px; margin-bottom: 8px;">Account Verification</h3>
            <p id="del-verify-body" style="font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.4;"></p>
            <p id="verify-account-error" class="hidden" style="font-size: 11px; color: #ef4444; margin-bottom: 12px;"></p>
            <button id="verify-google-account-btn" class="secondary-btn" style="margin-bottom: 8px;">Confirm Deletion</button>
            <button id="cancel-verify-btn" onclick="closeVerifyAccountModal()" style="background: none; border: none; color: var(--subtle); font-size: 11px; cursor: pointer; padding: 6px;">Cancel</button>
        </div>
    </div>

    <div id="delete-confirm-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;">
        <div class="card" style="max-width: 320px; width: 100%; text-align: center;">
            <h3 id="del-final-title" style="font-size: 14px; margin-bottom: 8px;">Are you absolutely sure?</h3>
            <p id="delete-confirm-email" style="font-size: 12px; color: var(--muted); margin-bottom: 20px;"></p>
            <div style="display: flex; gap: 8px;">
                <button id="cancel-final-del-btn" onclick="closeFinalDeleteModal()" class="secondary-btn">Cancel</button>
                <button id="final-delete-btn" class="danger-btn">Delete</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

                function detectAppLang() {
            const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"])
                .map(l => String(l).toLowerCase());
            if (list.some(l => l === "ru" || l.startsWith("ru-"))) return "ru";
            if (list.some(l => l === "de" || l.startsWith("de-"))) return "de";
            return "en";
        }

        const currentLang = detectAppLang();
        const tProf = i18nProfile[currentLang];
        document.documentElement.lang = tProf.lang;

        document.getElementById("prof-loading-text").textContent = tProf.loading;
        document.getElementById("prof-synced-text").textContent = tProf.synced;

    <script type="module">
        import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { initializeFirestore, doc, getDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });

        const OWNER_EMAILS = ["danya@gmail.com", "kinshipbot@gmail.com"];
        const ALLOWED_COUNTRIES = ['US', 'RU'];

        async function verifyRegionOrKick() {
            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();
                const countryCode = (data.country_code || '').toUpperCase();

                if (!data.success || !ALLOWED_COUNTRIES.includes(countryCode)) {
                    localStorage.removeItem('kinship_unlocked');
                    try {
                        await signOut(auth);
                    } catch (_) {}
                    window.location.replace("unavailable.html");
                    return false;
                }
                return true;
            } catch (err) {
                window.location.replace("unavailable.html");
                return false;
            }
        }
        

        let currentUser = null;
        let savedUserData = null;

        const handleLogout = async () => {
            localStorage.removeItem('kinship_unlocked');
            await signOut(auth);
            window.location.href = "index.html";
        };

        document.getElementById('logout-btn').addEventListener('click', handleLogout);

        const setPasswordBtn = document.getElementById('set-password-btn');
        const setPasswordModal = document.getElementById('set-password-modal');
        const savePasswordBtn = document.getElementById('save-password-btn');
        const setPassError = document.getElementById('set-pass-error');

        setPasswordBtn.addEventListener('click', () => {
            document.getElementById('input-new-pass').value = '';
            document.getElementById('input-new-pass-confirm').value = '';
            setPassError.classList.add('hidden');
            setPasswordModal.classList.remove('hidden');
        });

        savePasswordBtn.addEventListener('click', async () => {
            const p1 = document.getElementById('input-new-pass').value;
            const p2 = document.getElementById('input-new-pass-confirm').value;
            setPassError.classList.add('hidden');

            if (!p1 || p1.length < 6) {
                setPassError.textContent = tProf.passMinErr;
                setPassError.classList.remove('hidden');
                return;
            }
            if (p1 !== p2) {
                setPassError.textContent = tProf.passMismatchErr;
                setPassError.classList.remove('hidden');
                return;
            }

            try {
                const userRef = doc(db, "users", currentUser.uid);
                await setDoc(userRef, { password: p1 }, { merge: true });
                savedUserData.password = p1;
                setPasswordModal.classList.add('hidden');
                setPasswordBtn.style.display = 'none';
                alert(tProf.passSetAlert);
            } catch (e) {
                setPassError.textContent = tProf.errPrefix + e.message;
                setPassError.classList.remove('hidden');
            }
        });

        const deleteAccountBtn = document.getElementById('delete-account-btn');
        const deleteWarningModal = document.getElementById('delete-warning-modal');
        const deleteVerifyAccountModal = document.getElementById('delete-verify-account-modal');
        const deleteConfirmModal = document.getElementById('delete-confirm-modal');
        const chkDownloaded = document.getElementById('chk-downloaded');
        const chkConfirm = document.getElementById('chk-confirm');
        const proceedDeleteBtn = document.getElementById('proceed-delete-btn');
        const downloadDataBtn = document.getElementById('download-data-btn');
        const verifyGoogleAccountBtn = document.getElementById('verify-google-account-btn');
        const verifyAccountError = document.getElementById('verify-account-error');
        const finalDeleteBtn = document.getElementById('final-delete-btn');

        deleteAccountBtn.addEventListener('click', () => {
            chkDownloaded.checked = false;
            chkConfirm.checked = false;
            proceedDeleteBtn.disabled = true;
            proceedDeleteBtn.style.opacity = '0.5';
            proceedDeleteBtn.style.cursor = 'not-allowed';
            deleteWarningModal.classList.remove('hidden');
        });

        function updateDeleteButtonState() {
            if (chkDownloaded.checked && chkConfirm.checked) {
                proceedDeleteBtn.disabled = false;
                proceedDeleteBtn.style.opacity = '1';
                proceedDeleteBtn.style.cursor = 'pointer';
            } else {
                proceedDeleteBtn.disabled = true;
                proceedDeleteBtn.style.opacity = '0.5';
                proceedDeleteBtn.style.cursor = 'not-allowed';
            }
        }
        chkDownloaded.addEventListener('change', updateDeleteButtonState);
        chkConfirm.addEventListener('change', updateDeleteButtonState);

        downloadDataBtn.addEventListener('click', () => {
            if (!savedUserData && !currentUser) return;
            const dataToExport = {
                uid: currentUser.uid,
                email: currentUser.email,
                nickname: savedUserData?.nickname || currentUser.displayName,
                role: savedUserData?.role || 'user',
                dob: savedUserData?.dob || '',
                gender: savedUserData?.gender || 'not_specified',
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'kinship-account-data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        proceedDeleteBtn.addEventListener('click', () => {
            deleteWarningModal.classList.add('hidden');
            document.getElementById('del-verify-body').innerHTML = tProf.delVerifyBody(currentUser.email);
            verifyAccountError.classList.add('hidden');
            deleteVerifyAccountModal.classList.remove('hidden');
        });

        verifyGoogleAccountBtn.addEventListener('click', async () => {
            if (!currentUser) return;
            verifyAccountError.classList.add('hidden');

            const verifyApp = initializeApp(firebaseConfig, "verifyApp_" + Date.now());
            const verifyAuth = getAuth(verifyApp);
            const verifyProvider = new GoogleAuthProvider();
            verifyProvider.setCustomParameters({ prompt: 'select_account' });

            try {
                const res = await signInWithPopup(verifyAuth, verifyProvider);
                const selectedEmail = res.user.email;
                const selectedUid = res.user.uid;
                await signOut(verifyAuth);
                await deleteApp(verifyApp);

                if (selectedUid === currentUser.uid || selectedEmail === currentUser.email) {
                    deleteVerifyAccountModal.classList.add('hidden');
                    document.getElementById('delete-confirm-email').textContent = currentUser.email;
                    deleteConfirmModal.classList.remove('hidden');
                } else {
                    verifyAccountError.textContent = tProf.wrongAccErr(selectedEmail, currentUser.email);
                    verifyAccountError.classList.remove('hidden');
                }
            } catch (err) {
                try { await deleteApp(verifyApp); } catch (_) {}
                verifyAccountError.textContent = tProf.verifyFailErr;
                verifyAccountError.classList.remove('hidden');
            }
        });

        finalDeleteBtn.addEventListener('click', async () => {
            if (!currentUser) return;
            try {
                deleteConfirmModal.classList.add('hidden');
                document.getElementById('profile-screen').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                await deleteDoc(doc(db, "users", currentUser.uid));
                handleLogout();
            } catch (e) {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('profile-screen').classList.remove('hidden');
                alert(tProf.delErrAlert(e.message));
            }
        });

        verifyRegionOrKick().then(isAllowed => {
            if (!isAllowed) return;

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "index.html";
                    return;
                }

                if (localStorage.getItem('kinship_unlocked') !== user.uid) {
                    window.location.href = "auth.html";
                    return;
                }

                currentUser = user;

                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    if (!userSnap.exists()) {
                        window.location.href = "auth.html";
                        return;
                    }

                    savedUserData = userSnap.data();
                    const nickname = savedUserData.nickname || user.displayName || tProf.userFallback;
                    const role = savedUserData.role || (OWNER_EMAILS.includes(user.email) ? 'owner' : 'user');

                    document.getElementById('user-avatar').src = user.photoURL || 'https://via.placeholder.com/64';
                    document.getElementById('profile-nickname').textContent = nickname;
                    document.getElementById('user-email').textContent = user.email;

                    if (!savedUserData.password) {
                        setPasswordBtn.style.display = 'block';
                    } else {
                        setPasswordBtn.style.display = 'none';
                    }

                    const badgeContainer = document.getElementById('role-badge-container');
                    badgeContainer.innerHTML = '';

                    if (role === 'owner') {
                        badgeContainer.innerHTML = `
                            <div class="premium-diamond-badge">
                                <span class="diamond-icon"></span>
                                <span>Owner</span>
                            </div>
                        `;
                    } else if (role === 'premium') {
                        badgeContainer.innerHTML = `
                            <div class="premium-diamond-badge">
                                <span class="diamond-icon"></span>
                                <span>Premium</span>
                            </div>
                        `;
                    } else if (role === 'admin') {
                        badgeContainer.innerHTML = `<span style="display:inline-block; background:rgba(59,130,246,0.1); color:#3b82f6; font-size:11px; font-weight:bold; padding:4px 10px; border-radius:8px; margin-bottom:8px;">🛡️ Admin</span>`;
                    }

                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('profile-screen').classList.remove('hidden');
                } catch (e) {
                    alert(tProf.loadErrAlert(e.message));
                    handleLogout();
                }
            });
        });
    </script>
</body>
</html>
