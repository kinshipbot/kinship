<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Information</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *, body, h1, h2, p, button, a {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }
        h2 { font-weight: 800 !important; }
        p { font-weight: 500 !important; }
        button, a { font-weight: 700 !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-950 dark:bg-gray-950 dark:text-white min-h-screen flex flex-col justify-between items-center p-6 m-0 text-center transition-colors duration-300">

    <div class="max-w-sm w-full text-left">
        <!-- Header with Back Button -->
        <div class="flex items-center justify-between mb-6">
            <button onclick="window.location.href='index.html'" class="bg-gray-100 text-gray-800 hover:bg-gray-200 dark:bg-gray-800 dark:text-white px-3.5 py-2 rounded-xl text-xs cursor-pointer transition flex items-center gap-1.5 font-bold">
                ← Back
            </button>
            <p class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest notranslate">Kinship</p>
        </div>

        <!-- Content Container -->
        <div class="bg-white border-gray-200 dark:bg-gray-900 border dark:border-gray-800 p-6 rounded-2xl shadow-sm">
            <h2 id="page-title" class="text-base text-gray-950 dark:text-white mb-3"></h2>
            <div id="page-content" class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed space-y-3"></div>
        </div>
    </div>

    <footer class="text-xs text-gray-500 dark:text-gray-600 flex flex-col items-center gap-1.5 mt-6">
        <p class="text-[11px] text-gray-400 dark:text-gray-700 font-normal">&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tab = urlParams.get('tab') || 'terms';

        const titleEl = document.getElementById('page-title');
        const contentEl = document.getElementById('page-content');

        if (tab === 'terms') {
            titleEl.textContent = 'Terms of Service';
            contentEl.innerHTML = `
                <p>Kinship is currently in private beta. Be respectful, share good vibes, and keep the community safe.</p>
                <p>By using our platform, you agree to follow internal rules, respect other members, and not abuse cloud storage limits.</p>
            `;
        } else if (tab === 'privacy') {
            titleEl.textContent = 'Privacy Policy';
            contentEl.innerHTML = `
                <p>We care about your data. We only use your Google profile name, email, and avatar exclusively to authenticate your account and sync data in real time.</p>
                <p>Your passwords are securely encrypted and stored in the cloud database.</p>
            `;
        } else if (tab === 'contact') {
            titleEl.textContent = 'Contact & Support';
            contentEl.innerHTML = `
                <p>Have questions about the project, bugs, or premium status?</p>
                <p>You can always reach out to our support team via email:</p>
                <p><a href="mailto:hello@kinship.app" class="text-blue-500 hover:underline">hello@kinship.app</a></p>
            `;
        } else {
            titleEl.textContent = 'Kinship Info';
            contentEl.innerHTML = `<p>Welcome to the Kinship information section.</p>`;
        }
    </script>
</body>
</html>
