<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Сканер QR и кода</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Кроссбраузерный декодер QR с камеры (работает на всех Android и iOS) -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --secondary-bg: #f3f4f6;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --secondary-bg: #1f2937;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --error-bg: #3f1515;
                --error-text: #fca5a5;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px 20px;
            text-align: center;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .back-link {
            text-decoration: none;
            color: var(--muted);
            background: var(--secondary-bg);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.45;
            margin-bottom: 16px;
        }
        .camera-box {
            position: relative;
            width: 100%;
            height: 240px;
            border-radius: 18px;
            overflow: hidden;
            background: #000000;
            border: 1px solid var(--card-border);
            margin-bottom: 12px;
        }
        video#video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scan-frame {
            position: absolute;
            inset: 32px;
            border: 2px dashed rgba(255, 255, 255, 0.75);
            border-radius: 16px;
            pointer-events: none;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 13px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: var(--btn-bg);
            color: var(--btn-text);
        }
        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text);
        }
        .divider {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 8px 0 12px;
        }
        .code-input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 13px;
            border: 1px solid var(--card-border);
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .error-box {
            display: none;
            background: var(--error-bg);
            color: var(--error-text);
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-row">
            <a href="setting-kinship.html" class="back-link">← Назад</a>
            <span style="font-size:11px;font-weight:700;color:var(--muted);">Сканер устройства</span>
        </div>

        <h1>Подключить устройство</h1>
        <p class="desc">
            Наведите камеру на QR-код, который отображается на другом устройстве, или введите его секретный код вручную.
        </p>

        <div class="camera-box">
            <video id="video" playsinline muted></video>
            <div class="scan-frame"></div>
        </div>
        <canvas id="scan-canvas" style="display:none;"></canvas>

        <button id="start-cam-btn" class="btn btn-secondary" type="button">Включить камеру</button>

        <div class="divider">или введите код с экрана</div>

        <input id="code-input" class="code-input" type="text" placeholder="KSP-XXXXXX" maxlength="12">
        <button id="submit-code-btn" class="btn btn-primary" type="button">Продолжить</button>

        <div id="error-box" class="error-box"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "bib-chat-64027.firebaseapp.com",
            databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com",
            projectId: "bib-chat-64027",
            storageBucket: "bib-chat-64027.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const video = document.getElementById("video");
        const canvas = document.getElementById("scan-canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const errorBox = document.getElementById("error-box");
        let stream = null;
        let isChecking = false;

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = "block";
        }

        function extractCode(rawText) {
            const cleaned = rawText.trim();
            if (cleaned.includes("code=")) {
                try {
                    const url = new URL(cleaned);
                    return (url.searchParams.get("code") || "").toUpperCase();
                } catch (_) {}
            }
            return cleaned.toUpperCase();
        }

        // Строгая проверка кода по Firebase Realtime Database
        async function validateAndProceed(rawValue) {
            if (isChecking) return;
            errorBox.style.display = "none";

            const code = extractCode(rawValue);
            if (!code || !/^KSP-[A-Z0-9]{6}$/.test(code)) {
                showError("Неверный формат кода. Введите действующий код вида KSP-XXXXXX.");
                return;
            }

            isChecking = true;
            try {
                const sessionRef = ref(db, "qr_sessions/" + code);
                const snap = await get(sessionRef);

                if (!snap.exists()) {
                    showError("Код не найден в облаке! Нельзя войти по случайному коду.");
                    isChecking = false;
                    return;
                }

                const data = snap.val();
                if (data.expiresAt && Date.now() > data.expiresAt) {
                    showError("Срок действия этого QR-кода истёк. Обновите код на другом устройстве.");
                    isChecking = false;
                    return;
                }

                if (data.status === "approved" || data.status === "rejected") {
                    showError("Этот код уже был использован.");
                    isChecking = false;
                    return;
                }

                // Помечаем в облаке, что код отсканирован, и переходим на страницу подтверждения
                await update(sessionRef, { status: "scanned" });
                if (stream) stream.getTracks().forEach(t => t.stop());

                window.location.href = `qr-device-login.html?code=${encodeURIComponent(code)}`;
            } catch (err) {
                showError("Ошибка проверки в базе данных: " + err.message);
                isChecking = false;
            }
        }

        // Запуск камеры и сканирование через jsQR
        document.getElementById("start-cam-btn").addEventListener("click", async () => {
            errorBox.style.display = "none";
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                video.srcObject = stream;
                await video.play();
                requestAnimationFrame(tickScan);
            } catch (e) {
                showError("Не удалось открыть камеру. Разрешите доступ или введите код вручную ниже.");
            }
        });

        function tickScan() {
            if (!stream || isChecking) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const qr = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert"
                });

                if (qr && qr.data) {
                    validateAndProceed(qr.data);
                    return;
                }
            }
            requestAnimationFrame(tickScan);
        }

        document.getElementById("submit-code-btn").addEventListener("click", () => {
            const val = document.getElementById("code-input").value;
            validateAndProceed(val);
        });
    </script>
</body>
</html>
