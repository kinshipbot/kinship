<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — QR Scan</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --secondary-bg: #f3f4f6;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --btn-hover: #1f2937;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --secondary-bg: #1f2937;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --btn-hover: #e5e7eb;
                --error-bg: #3f1515;
                --error-text: #fca5a5;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .back-link {
            text-decoration: none;
            color: var(--muted);
            background: var(--secondary-bg);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            background: var(--secondary-bg);
            padding: 5px 10px;
            border-radius: 999px;
        }
        h1 {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.45;
            margin-bottom: 16px;
        }
        .camera-box {
            position: relative;
            width: 100%;
            height: 235px;
            border-radius: 18px;
            overflow: hidden;
            background: #000000;
            border: 1px solid var(--card-border);
            margin-bottom: 12px;
        }
        video#video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scan-frame {
            position: absolute;
            inset: 30px;
            border: 2px dashed rgba(255, 255, 255, 0.75);
            border-radius: 16px;
            pointer-events: none;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 13px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.2s ease, transform 0.12s ease;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: var(--btn-bg);
            color: var(--btn-text);
        }
        .btn-primary:hover { background: var(--btn-hover); }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
        }
        .divider {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 4px 0 12px;
        }
        .code-input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 13px;
            border: 1px solid var(--card-border);
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .status-msg {
            display: none;
            background: var(--secondary-bg);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error-box {
            display: none;
            background: var(--error-bg);
            color: var(--error-text);
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 6px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-row">
            <a id="back-link" href="index.html" class="back-link">← Назад</a>
            <span id="badge-text" class="badge">Сканер QR</span>
        </div>

        <h1 id="scan-title">Сканирование QR-кода</h1>
        <p id="scan-desc" class="desc">
            Отсканируйте QR-код с другого устройства или введите код, который отображается там.
        </p>

        <div class="camera-box">
            <video id="video" playsinline muted></video>
            <div class="scan-frame"></div>
        </div>
        <canvas id="scan-canvas" style="display:none;"></canvas>

        <button id="start-cam-btn" class="btn btn-secondary" type="button">Включить камеру</button>

        <div id="divider-text" class="divider">или введите код с другого устройства</div>

        <input id="code-input" class="code-input" type="text" placeholder="KSP-XXXXXX" maxlength="200">
        <div id="status-msg" class="status-msg"></div>
        <button id="submit-code-btn" class="btn btn-primary" type="button">Продолжить</button>

        <div id="error-box" class="error-box"></div>
    </div>

    <script>
        const i18nScan = {
            ru: {
                lang: "ru",
                back: "← Назад",
                badge: "Сканер QR",
                title: "Сканирование QR-кода",
                desc: "Отсканируйте QR-код с другого устройства или введите код, который отображается там.",
                startCam: "Включить камеру",
                divider: "или введите код с другого устройства",
                submit: "Продолжить",
                camStarted: "Камера включена, наведите на QR-код...",
                camError: "Не удалось открыть камеру. Разрешите доступ или введите код вручную ниже.",
                badFormat: "Неверный формат кода. Введите действующий код вида KSP-XXXXXX.",
                checking: (code) => `Проверяю код ${code} в базе...`,
                notFound: (code) => `Код ${code} не найден в базе. Убедитесь, что он создан на другом устройстве.`,
                expired: "Срок действия кода истёк. Сгенерируйте новый код.",
                used: "Этот код уже был использован.",
                redirecting: "Код подтверждён, перехожу на страницу ожидания...",
                dbError: (msg) => `Ошибка при обращении к базе: ${msg}`
            },
            en: {
                lang: "en",
                back: "← Back",
                badge: "QR Scanner",
                title: "Scan QR Code",
                desc: "Scan the QR code from another device or enter the code shown there.",
                startCam: "Turn on camera",
                divider: "or enter the code from another device",
                submit: "Continue",
                camStarted: "Camera enabled, point it at the QR code...",
                camError: "Could not access camera. Allow permission or enter the code manually below.",
                badFormat: "Invalid code format. Enter a valid code like KSP-XXXXXX.",
                checking: (code) => `Checking code ${code} in database...`,
                notFound: (code) => `Code ${code} was not found in the database.`,
                expired: "This code has expired. Generate a new code.",
                used: "This code has already been used.",
                redirecting: "Code verified, redirecting to waiting screen...",
                dbError: (msg) => `Database error: ${msg}`
            },
            de: {
                lang: "de",
                back: "← Zurück",
                badge: "QR-Scanner",
                title: "QR-Code scannen",
                desc: "Scanne den QR-Code von einem anderen Gerät oder gib den dort angezeigten Code ein.",
                startCam: "Kamera aktivieren",
                divider: "oder Code von einem anderen Gerät eingeben",
                submit: "Weiter",
                camStarted: "Kamera aktiv, richte sie auf den QR-Code...",
                camError: "Kamera konnte nicht geöffnet werden. Erlaube den Zugriff oder gib den Code unten ein.",
                badFormat: "Ungültiges Code-Format. Gib einen gültigen Code wie KSP-XXXXXX ein.",
                checking: (code) => `Prüfe Code ${code} in der Datenbank...`,
                notFound: (code) => `Code ${code} wurde in der Datenbank nicht gefunden.`,
                expired: "Der Code ist abgelaufen. Erstelle einen neuen Code.",
                used: "Dieser Code wurde bereits verwendet.",
                redirecting: "Code bestätigt, leite zur Warteseite weiter...",
                dbError: (msg) => `Datenbankfehler: ${msg}`
            }
        };

        function detectLang() {
            const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "ru"])
                .map(l => String(l).toLowerCase());
            if (langs.some(l => l === "ru" || l.startsWith("ru-"))) return "ru";
            if (langs.some(l => l === "de" || l.startsWith("de-"))) return "de";
            return "en";
        }

        const tScan = i18nScan[detectLang()];
        document.documentElement.lang = tScan.lang;
        document.getElementById("back-link").textContent = tScan.back;
        document.getElementById("badge-text").textContent = tScan.badge;
        document.getElementById("scan-title").textContent = tScan.title;
        document.getElementById("scan-desc").textContent = tScan.desc;
        document.getElementById("start-cam-btn").textContent = tScan.startCam;
        document.getElementById("divider-text").textContent = tScan.divider;
        document.getElementById("submit-code-btn").textContent = tScan.submit;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            databaseURL: "https://kinship-1a33b-default-rtdb.firebaseio.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const video = document.getElementById("video");
        const canvas = document.getElementById("scan-canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const errorBox = document.getElementById("error-box");
        const statusMsg = document.getElementById("status-msg");
        const submitBtn = document.getElementById("submit-code-btn");
        const codeInput = document.getElementById("code-input");

        let stream = null;
        let isChecking = false;

        function showError(msg) {
            statusMsg.style.display = "none";
            errorBox.textContent = msg;
            errorBox.style.display = "block";
        }

        function showStatus(msg) {
            errorBox.style.display = "none";
            statusMsg.textContent = msg;
            statusMsg.style.display = "block";
        }

        function extractCode(rawText) {
            const cleaned = String(rawText || "").trim();
            if (!cleaned) return "";

            if (cleaned.includes("code=")) {
                try {
                    const url = new URL(cleaned);
                    const fromUrl = url.searchParams.get("code");
                    if (fromUrl) return fromUrl.trim().toUpperCase();
                } catch (_) {
                    const match = cleaned.match(/code=([A-Za-z0-9-]+)/i);
                    if (match) return match[1].trim().toUpperCase();
                }
            }

            const codeMatch = cleaned.toUpperCase().match(/KSP-[A-Z0-9]{6}/);
            if (codeMatch) return codeMatch[0];

            return cleaned.toUpperCase();
        }

        async function checkAndGo(rawValue) {
            if (isChecking) return;
            errorBox.style.display = "none";

            const code = extractCode(rawValue);
            if (!code || !/^KSP-[A-Z0-9]{6}$/.test(code)) {
                showError(tScan.badFormat);
                return;
            }

            isChecking = true;
            submitBtn.disabled = true;
            showStatus(tScan.checking(code));

            try {
                const sessionRef = ref(db, "qr_sessions/" + code);
                const snap = await get(sessionRef);

                if (!snap.exists()) {
                    showError(tScan.notFound(code));
                    isChecking = false;
                    submitBtn.disabled = false;
                    return;
                }

                const data = snap.val();
                if (data.expiresAt && Date.now() > data.expiresAt) {
                    showError(tScan.expired);
                    isChecking = false;
                    submitBtn.disabled = false;
                    return;
                }

                if (data.status === "approved" || data.status === "rejected") {
                    showError(tScan.used);
                    isChecking = false;
                    submitBtn.disabled = false;
                    return;
                }

                showStatus(tScan.redirecting);
                await update(sessionRef, {
                    status: "scanned",
                    scannedAt: Date.now()
                });

                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }

                window.location.href = `qr-device-login.html?code=${encodeURIComponent(code)}`;
            } catch (err) {
                showError(tScan.dbError(err.message || err));
                isChecking = false;
                submitBtn.disabled = false;
            }
        }

        document.getElementById("start-cam-btn").addEventListener("click", async () => {
            errorBox.style.display = "none";
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                video.srcObject = stream;
                await video.play();
                showStatus(tScan.camStarted);
                requestAnimationFrame(scanFrame);
            } catch (_) {
                showError(tScan.camError);
            }
        });

        function scanFrame() {
            if (!stream || isChecking) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const qr = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert"
                });

                if (qr && qr.data) {
                    checkAndGo(qr.data);
                    return;
                }
            }
            requestAnimationFrame(scanFrame);
        }

        submitBtn.addEventListener("click", () => {
            checkAndGo(codeInput.value);
        });

        codeInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                checkAndGo(codeInput.value);
            }
        });
    </script>
</body>
</html>
