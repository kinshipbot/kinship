<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Вход по QR-коду</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Библиотека генерации настоящего сканируемого QR-кода -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --subtle: #6b7280;
            --secondary-bg: #f3f4f6;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --warn: #f59e0b;
            --ok: #10b981;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --subtle: #6b7280;
                --secondary-bg: #1f2937;
                --btn-bg: #ffffff;
                --btn-text: #000000;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 26px 22px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .back-link {
            text-decoration: none;
            color: var(--muted);
            background: var(--secondary-bg);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 999px;
            background: var(--secondary-bg);
            color: var(--muted);
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .qr-wrapper {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 18px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }
        #qrcode {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .code-label {
            margin-top: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .secret-code {
            margin-top: 4px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.16em;
            color: #030712;
            background: #f3f4f6;
            padding: 7px 14px;
            border-radius: 10px;
            user-select: all;
        }
        .status-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--secondary-bg);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--warn);
            animation: pulse 1.2s infinite;
        }
        .dot.ok {
            background: var(--ok);
            animation: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }
        .btn-refresh {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 13px 16px;
            background: var(--secondary-bg);
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-row">
            <a id="back-btn" href="index.html" class="back-link">← Назад</a>
            <span class="badge">Cloud QR Auth</span>
        </div>

        <h1>Вход по QR-коду</h1>
        <p class="desc">
            Откройте на другом устройстве страницу сканирования Kinship, отсканируйте этот QR-код или введите секретный код ниже.
        </p>

        <div class="qr-wrapper">
            <div id="qrcode"></div>
            <div class="code-label">Секретный код входа</div>
            <div id="secret-code" class="secret-code">------</div>
        </div>

        <div class="status-box">
            <span id="status-dot" class="dot"></span>
            <span id="status-text">Создание облачной сессии...</span>
        </div>

        <button id="refresh-btn" class="btn-refresh" type="button">Сгенерировать новый QR и код</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // ВСТАВЬ СВОЙ FIREBASE CONFIG ИЗ ПРОЕКТА KINSHIP
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "bib-chat-64027.firebaseapp.com",
            databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com",
            projectId: "bib-chat-64027",
            storageBucket: "bib-chat-64027.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        if (params.get("from") === "settings") {
            document.getElementById("back-btn").href = "setting-kinship.html";
        }

        let currentRef = null;

        function getDeviceDescription() {
            const ua = navigator.userAgent;
            if (/Android/i.test(ua)) return "Android Смартфон";
            if (/iPhone|iPad/i.test(ua)) return "iPhone / iPad";
            if (/Windows/i.test(ua)) return "ПК (Windows)";
            return "Веб-браузер";
        }

        function generateSecretCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let code = "KSP-";
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        async function createCloudSession() {
            if (currentRef) {
                off(currentRef);
            }

            const code = generateSecretCode();
            const qrContainer = document.getElementById("qrcode");
            const codeEl = document.getElementById("secret-code");
            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            statusDot.classList.remove("ok");
            statusText.textContent = "Ожидание сканирования и подтверждения...";
            codeEl.textContent = code;
            qrContainer.innerHTML = "";

            // В QR-код зашиваем ссылку сразу на страницу подтверждения с этим кодом
            const scanPayload = `${window.location.origin}${window.location.pathname.replace("qr-login.html", "qr-device-login.html")}?code=${code}`;

            new QRCode(qrContainer, {
                text: scanPayload,
                width: 200,
                height: 200,
                colorDark: "#030712",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            currentRef = ref(db, "qr_sessions/" + code);

            await set(currentRef, {
                code: code,
                status: "pending",
                deviceName: getDeviceDescription(),
                createdAt: Date.now(),
                expiresAt: Date.now() + 5 * 60 * 1000 // 5 минут жизни кода
            });

            // Слушаем изменения в реальном времени из облака
            onValue(currentRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (data.status === "scanned") {
                    statusText.textContent = "Код отсканирован! Подтвердите вход на другом устройстве...";
                } else if (data.status === "approved") {
                    statusDot.classList.add("ok");
                    statusText.textContent = "Вход подтверждён! Переход в профиль...";

                    if (data.uid) localStorage.setItem("kinship_uid", data.uid);
                    if (data.userName) localStorage.setItem("kinship_user_name", data.userName);
                    if (data.userHandle) localStorage.setItem("kinship_user_handle", data.userHandle);

                    setTimeout(() => {
                        window.location.href = "profile.html";
                    }, 800);
                } else if (data.status === "rejected") {
                    statusText.textContent = "Вход отклонён с другого устройства.";
                }
            });
        }

        document.getElementById("refresh-btn").addEventListener("click", createCloudSession);
        createCloudSession();
    </script>
</body>
</html>
