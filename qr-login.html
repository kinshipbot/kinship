<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — QR-код входа</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --secondary-bg: #f3f4f6;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --secondary-bg: #1f2937;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --danger-bg: #3f1515;
                --danger-text: #fca5a5;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 26px 22px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .back-link {
            text-decoration: none;
            color: var(--muted);
            background: var(--secondary-bg);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 999px;
            background: var(--secondary-bg);
            color: var(--muted);
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .qr-wrapper {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 18px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 14px;
        }
        #qrcode {
            width: 196px;
            height: 196px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .code-label {
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .secret-code {
            margin-top: 4px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.16em;
            color: #030712;
            background: #f3f4f6;
            padding: 7px 14px;
            border-radius: 10px;
            user-select: all;
        }
        .status-box {
            background: var(--secondary-bg);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text);
        }
        .btn-accept {
            background: var(--btn-bg);
            color: var(--btn-text);
        }
        .btn-reject {
            background: var(--danger-bg);
            color: var(--danger-text);
        }
        .decision-box {
            display: none;
            background: var(--secondary-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 18px 16px;
            margin-top: 8px;
        }
        .decision-box h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .decision-box p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.45;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-row">
            <a id="back-link" href="index.html" class="back-link">← Назад</a>
            <span class="badge">Kinship QR</span>
        </div>

        <div id="qr-stage">
            <h1>Вход по QR-коду</h1>
            <p class="desc">
                Наведите камеру на QR-код для перехода по ссылке или отсканируйте его в <span class="notranslate">qr-scan.html</span> / введите код ниже.
            </p>

            <div class="qr-wrapper">
                <div id="qrcode"></div>
                <div class="code-label">Секретный код</div>
                <div id="secret-code" class="secret-code">------</div>
            </div>

            <div id="waiting-status" class="status-box">Ожидание сканирования или ввода кода...</div>

            <button id="refresh-btn" class="btn btn-secondary" type="button">Сгенерировать новый код</button>
        </div>

        <div id="decision-stage" class="decision-box">
            <h2>Запрос на вход</h2>
            <p id="decision-desc">
                Код отсканирован/введён с другого устройства. Принять или отклонить вход?
            </p>
            <button id="accept-btn" class="btn btn-accept" type="button">Принять вход</button>
            <button id="reject-btn" class="btn btn-reject" type="button">Отклонить</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            databaseURL: "https://kinship-1a33b-default-rtdb.firebaseio.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        if (params.get("from") === "settings") {
            document.getElementById("back-link").href = "setting-kinship.html";
        }

        const qrStage = document.getElementById("qr-stage");
        const decisionStage = document.getElementById("decision-stage");
        const waitingStatus = document.getElementById("waiting-status");
        const acceptBtn = document.getElementById("accept-btn");
        const rejectBtn = document.getElementById("reject-btn");

        let currentCode = "";
        let currentRef = null;

        function generateCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let code = "KSP-";
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        async function startNewSession() {
            if (currentRef) {
                off(currentRef);
            }

            currentCode = generateCode();
            qrStage.style.display = "block";
            decisionStage.style.display = "none";
            acceptBtn.disabled = false;
            rejectBtn.disabled = false;
            waitingStatus.textContent = "Ожидание сканирования или ввода кода...";

            document.getElementById("secret-code").textContent = currentCode;
            const qrEl = document.getElementById("qrcode");
            qrEl.innerHTML = "";

            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
            const qrLink = `${baseUrl}qr-device-login.html?code=${encodeURIComponent(currentCode)}`;

            new QRCode(qrEl, {
                text: qrLink,
                width: 196,
                height: 196,
                colorDark: "#030712",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            currentRef = ref(db, "qr_sessions/" + currentCode);
            await set(currentRef, {
                code: currentCode,
                status: "pending",
                createdAt: Date.now(),
                expiresAt: Date.now() + 5 * 60 * 1000
            });

            onValue(currentRef, (snap) => {
                const data = snap.val();
                if (!data) return;

                if (data.status === "scanned") {
                    qrStage.style.display = "none";
                    decisionStage.style.display = "block";
                    document.getElementById("decision-desc").textContent =
                        `Код ${currentCode} отсканирован/введён с другого устройства. Принять или отклонить вход?`;
                }

                if (data.status === "approved") {
                    if (data.uid) localStorage.setItem("kinship_uid", data.uid);
                    if (data.userName) localStorage.setItem("kinship_user_name", data.userName);
                    if (data.userHandle) localStorage.setItem("kinship_user_handle", data.userHandle);
                    window.location.href = "profile.html";
                }

                if (data.status === "rejected") {
                    decisionStage.style.display = "none";
                    qrStage.style.display = "block";
                    waitingStatus.textContent = "Вход отклонён. Сгенерируйте новый код при необходимости.";
                }
            });
        }

        acceptBtn.addEventListener("click", async () => {
            if (!currentCode) return;
            acceptBtn.disabled = true;
            rejectBtn.disabled = true;

            const uid = localStorage.getItem("kinship_uid") || "kinship_user_" + currentCode;
            const userName = localStorage.getItem("kinship_user_name") || "Пользователь Kinship";
            const userHandle = localStorage.getItem("kinship_user_handle") || "@kinship_user";

            await update(ref(db, "qr_sessions/" + currentCode), {
                status: "approved",
                uid: uid,
                userName: userName,
                userHandle: userHandle,
                approvedAt: Date.now()
            });
        });

        rejectBtn.addEventListener("click", async () => {
            if (!currentCode) return;
            acceptBtn.disabled = true;
            rejectBtn.disabled = true;

            await update(ref(db, "qr_sessions/" + currentCode), {
                status: "rejected",
                rejectedAt: Date.now()
            });
        });

        document.getElementById("refresh-btn").addEventListener("click", startNewSession);
        startNewSession();
    </script>
</body>
</html>
