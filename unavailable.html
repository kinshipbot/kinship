<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Unavailable</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --subtle: #9ca3af;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --subtle: #6b7280;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 380px;
            width: 100%;
        }
        .brand {
            font-size: 12px;
            font-weight: 700;
            color: var(--subtle);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            line-height: 1.55;
            margin-bottom: 24px;
        }
        .notice-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .notice-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .thanks-text {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
        }
        footer {
            font-size: 12px;
            color: var(--subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer-links {
            display: flex;
            gap: 14px;
        }
        .footer-links a {
            color: var(--subtle);
            text-decoration: none;
        }
        .footer-links a:hover {
            color: var(--text);
        }
        .copy {
            font-size: 11px;
            opacity: 0.7;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .anim-1 { opacity: 0; animation: fadeUp 0.7s ease forwards; }
        .anim-2 { opacity: 0; animation: fadeUp 0.7s ease 0.15s forwards; }
        .anim-3 { opacity: 0; animation: fadeUp 0.7s ease 0.3s forwards; }
    </style>
</head>
<body>

    <div style="height: 16px;"></div>

    <div class="container">
        <p class="brand anim-1 notranslate">Kinship</p>
        <h1 id="hero-title" class="anim-1">Your best social network to find friends!</h1>
        <p id="hero-subtitle" class="subtitle anim-2">
            Play, chat, comment, watch, and like.
        </p>

        <div class="notice-card anim-3">
            <p id="notice-text" class="notice-text">
                <strong class="notranslate">Kinship</strong> is not available in your region yet — we are working hard to make it available for everyone!
            </p>
            <p id="thanks-text" class="thanks-text">
                Thank you for visiting the site.
            </p>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a id="link-terms" href="legal.html?tab=terms">Terms</a>
            <span>•</span>
            <a id="link-privacy" href="legal.html?tab=privacy">Privacy</a>
            <span>•</span>
            <a id="link-contact" href="legal.html?tab=contact">Contact</a>
        </div>
        <p class="copy">&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

    <script>
        (function () {
            const translations = {
                ru: {
                    lang: "ru",
                    title: "Kinship — Регион недоступен",
                    heroTitle: "Ваша лучшая соцсеть для поиска друзей!",
                    heroSubtitle: "Играйтесь, общайтесь, комментируйте, смотрите и лайкайте.",
                    noticeHtml: '<strong class="notranslate">Kinship</strong> пока не работает в вашем регионе, мы всё делаем для того, чтобы он был доступен для всех!',
                    thanks: "Спасибо, что посетили сайт.",
                    terms: "Условия",
                    privacy: "Конфиденциальность",
                    contact: "Контакты"
                },
                en: {
                    lang: "en",
                    title: "Kinship — Unavailable",
                    heroTitle: "Your best social network to find friends!",
                    heroSubtitle: "Play, chat, comment, watch, and like.",
                    noticeHtml: '<strong class="notranslate">Kinship</strong> is not available in your region yet — we are working hard to make it available for everyone!',
                    thanks: "Thank you for visiting the site.",
                    terms: "Terms",
                    privacy: "Privacy",
                    contact: "Contact"
                }
            };

            const deviceLangs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"])
                .map(l => String(l).toLowerCase());

            const isRussian = deviceLangs.some(l => l === "ru" || l.startsWith("ru-"));
            const t = isRussian ? translations.ru : translations.en;

            document.documentElement.lang = t.lang;
            document.title = t.title;
            document.getElementById("hero-title").textContent = t.heroTitle;
            document.getElementById("hero-subtitle").textContent = t.heroSubtitle;
            document.getElementById("notice-text").innerHTML = t.noticeHtml;
            document.getElementById("thanks-text").textContent = t.thanks;
            document.getElementById("link-terms").textContent = t.terms;
            document.getElementById("link-privacy").textContent = t.privacy;
            document.getElementById("link-contact").textContent = t.contact;
        })();
    </script>

</body>
</html>
