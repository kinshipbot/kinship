<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="udnUHBFzL2Us47m9qxyJWabmzRHfYsnHBpyANc-sgqI" />
    <title class="notranslate">Kinship</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --subtle: #6b7280;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --btn-hover: #1f2937;
            --secondary-btn-bg: #f3f4f6;
            --secondary-btn-text: #111827;
            --secondary-btn-hover: #e5e7eb;
            --badge-bg: #f3f4f6;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --subtle: #6b7280;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --btn-hover: #e5e7eb;
                --secondary-btn-bg: #1f2937;
                --secondary-btn-text: #f3f4f6;
                --secondary-btn-hover: #374151;
                --badge-bg: #1f2937;
                --error-bg: #3f1515;
                --error-text: #fca5a5;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            color: var(--subtle);
            background: var(--badge-bg);
            padding: 5px 12px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.55;
            margin-bottom: 24px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .primary-btn, .secondary-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            text-decoration: none;
            border: none;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.12s ease;
        }
        .primary-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
        }
        .primary-btn:hover { background-color: var(--btn-hover); }
        .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .secondary-btn {
            background-color: var(--secondary-btn-bg);
            color: var(--secondary-btn-text);
            border: 1px solid var(--card-border);
        }
        .secondary-btn:hover { background-color: var(--secondary-btn-hover); }
        .primary-btn:active, .secondary-btn:active { transform: scale(0.98); }
        .qr-hint {
            margin-top: 14px;
            font-size: 12px;
            color: var(--subtle);
            line-height: 1.45;
        }
        .auth-error {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--error-bg);
            color: var(--error-text);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
        }
        footer {
            font-size: 11px;
            color: var(--subtle);
        }
    </style>
</head>
<body>
    <div style="height: 8px;"></div>

    <div class="container card">
        <span class="brand notranslate">Kinship</span>
        <h1 id="welcome-title">Добро пожаловать</h1>
        <p id="welcome-desc" class="subtitle">
            Здесь вы можете найти друзей легче, чем кажется, пролайкать видео, комментировать, общаться и создавать моменты.
        </p>

        <div class="btn-group">
            <button id="btn-google-login" type="button" class="primary-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                <span id="google-btn-text">Войти с Google</span>
            </button>

            <a id="btn-qr-login" href="qr-scan.html" class="secondary-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <path d="M14 14h3v3h-3zM20 14v3h-3M14 20h7"/>
                </svg>
                <span id="qr-btn-text">Войти по QR-коду</span>
            </a>
        </div>

        <p id="qr-hint-text" class="qr-hint">
            Отсканируйте QR-код с другого устройства через камеру или введите секретный код входа.
        </p>

        <div id="auth-error" class="auth-error"></div>
    </div>

    <footer>
        <p>&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

    <script>
        const i18nIndex = {
            ru: {
                lang: "ru",
                title: "Добро пожаловать",
                desc: "Здесь вы можете найти друзей легче, чем кажется, пролайкать видео, комментировать, общаться и создавать моменты.",
                googleBtn: "Войти с Google",
                qrBtn: "Войти по QR-коду",
                qrHint: "Отсканируйте QR-код с другого устройства через камеру или введите секретный код входа."
            },
            en: {
                lang: "en",
                title: "Welcome",
                desc: "Here you can find friends easier than it seems, like videos, comment, chat, and create moments.",
                googleBtn: "Sign in with Google",
                qrBtn: "Sign in with QR Code",
                qrHint: "Scan the QR code from another device with your camera or enter the sign-in code."
            },
            de: {
                lang: "de",
                title: "Willkommen",
                desc: "Hier kannst du leichter als gedacht Freunde finden, Videos liken, kommentieren, chatten und Momente erstellen.",
                googleBtn: "Mit Google anmelden",
                qrBtn: "Mit QR-Code anmelden",
                qrHint: "Scanne den QR-Code von einem anderen Gerät mit der Kamera oder gib den Anmeldecode ein."
            }
        };

        function detectLang() {
            const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "ru"])
                .map(l => String(l).toLowerCase());
            if (langs.some(l => l === "ru" || l.startsWith("ru-"))) return "ru";
            if (langs.some(l => l === "de" || l.startsWith("de-"))) return "de";
            return "en";
        }

        const t = i18nIndex[detectLang()];
        document.documentElement.lang = t.lang;
        document.getElementById("welcome-title").textContent = t.title;
        document.getElementById("welcome-desc").textContent = t.desc;
        document.getElementById("google-btn-text").textContent = t.googleBtn;
        document.getElementById("qr-btn-text").textContent = t.qrBtn;
        document.getElementById("qr-hint-text").textContent = t.qrHint;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signInWithRedirect,
            getRedirectResult
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById("btn-google-login");
        const errorBox = document.getElementById("auth-error");

        function showAuthError(message) {
            errorBox.textContent = message;
            errorBox.style.display = "block";
        }

        function saveUserAndGo(user) {
            if (!user) return;
            const displayName = user.displayName || "Пользователь Kinship";
            const emailPrefix = user.email ? user.email.split("@")[0] : "kinship_user";
            localStorage.setItem("kinship_uid", user.uid);
            localStorage.setItem("kinship_user_name", displayName);
            localStorage.setItem("kinship_user_handle", "@" + emailPrefix);
            window.location.href = "profile.html";
        }

        // Проверяем результат редиректа (если использовался signInWithRedirect)
        getRedirectResult(auth)
            .then((result) => {
                if (result && result.user) {
                    saveUserAndGo(result.user);
                }
            })
            .catch((err) => {
                if (err && err.code && err.code !== "auth/no-auth-event") {
                    showAuthError(`Ошибка входа (${err.code}): ${err.message}`);
                }
            });

        googleBtn.addEventListener("click", async () => {
            errorBox.style.display = "none";
            googleBtn.disabled = true;

            try {
                const result = await signInWithPopup(auth, provider);
                saveUserAndGo(result.user);
            } catch (err) {
                if (
                    err.code === "auth/popup-blocked" ||
                    err.code === "auth/operation-not-supported-in-this-environment" ||
                    err.code === "auth/cancelled-popup-request"
                ) {
                    try {
                        await signInWithRedirect(auth, provider);
                        return;
                    } catch (redirectErr) {
                        showAuthError(`Ошибка редиректа (${redirectErr.code}): ${redirectErr.message}`);
                    }
                } else {
                    showAuthError(`Ошибка входа с Google (${err.code || "unknown"}): ${err.message}`);
                }
                googleBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
