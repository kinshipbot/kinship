<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --subtle: #9ca3af;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --btn-hover: #1f2937;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --subtle: #6b7280;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --btn-hover: #e5e7eb;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 380px;
            width: 100%;
        }
        .brand {
            font-size: 12px;
            font-weight: 700;
            color: var(--subtle);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            line-height: 1.55;
            margin-bottom: 24px;
        }
        .google-btn {
            width: 100%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 13px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover:not(:disabled) {
            background-color: var(--btn-hover);
        }
        .google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-msg {
            font-size: 12px;
            color: #ef4444;
            margin-top: 12px;
            font-weight: 600;
        }
        .hidden {
            display: none !important;
        }
        footer {
            font-size: 12px;
            color: var(--subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer-links {
            display: flex;
            gap: 14px;
        }
        .footer-links a {
            color: var(--subtle);
            text-decoration: none;
        }
        .footer-links a:hover {
            color: var(--text);
        }
        .copy {
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div style="height: 16px;"></div>

    <div class="container">
        <p class="brand notranslate">Kinship</p>
        <h1 id="idx-title">Your best social network to find friends!</h1>
        <p id="idx-subtitle" class="subtitle">Play, chat, comment, watch, and like.</p>

        <button id="google-signin-btn" type="button" class="google-btn">
            <span id="google-btn-text">Continue with Google</span>
        </button>

        <p id="idx-error" class="error-msg hidden"></p>
    </div>

    <footer>
        <div class="footer-links">
            <a id="idx-terms" href="legal.html?tab=terms">Terms</a>
            <span>•</span>
            <a id="idx-privacy" href="legal.html?tab=privacy">Privacy</a>
            <span>•</span>
            <a id="idx-contact" href="legal.html?tab=contact">Contact</a>
        </div>
        <p class="copy">&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

    <script>
        const i18nIndex = {
            en: {
                lang: "en",
                title: "Your best social network to find friends!",
                subtitle: "Play, chat, comment, watch, and like.",
                googleBtn: "Continue with Google",
                signingIn: "Signing in...",
                signInError: "Sign-in failed. Please try again.",
                terms: "Terms",
                privacy: "Privacy",
                contact: "Contact"
            },
            ru: {
                lang: "ru",
                title: "Ваша лучшая соцсеть для поиска друзей!",
                subtitle: "Играйтесь, общайтесь, комментируйте, смотрите и лайкайте.",
                googleBtn: "Войти через Google",
                signingIn: "Вход...",
                signInError: "Ошибка входа. Попробуйте ещё раз.",
                terms: "Условия",
                privacy: "Конфиденциальность",
                contact: "Контакты"
            },
            de: {
                lang: "de",
                title: "Dein bestes soziales Netzwerk, um Freunde zu finden!",
                subtitle: "Spielen, chatten, kommentieren, ansehen und liken.",
                googleBtn: "Mit Google fortfahren",
                signingIn: "Anmeldung...",
                signInError: "Anmeldung fehlgeschlagen. Bitte versuche es erneut.",
                terms: "Nutzungsbedingungen",
                privacy: "Datenschutz",
                contact: "Kontakt"
            }
        };

        function detectAppLang() {
            const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"])
                .map(l => String(l).toLowerCase());
            if (list.some(l => l === "ru" || l.startsWith("ru-"))) return "ru";
            if (list.some(l => l === "de" || l.startsWith("de-"))) return "de";
            return "en";
        }

        const currentLang = detectAppLang();
        const tIdx = i18nIndex[currentLang];

        document.documentElement.lang = tIdx.lang;
        document.getElementById("idx-title").textContent = tIdx.title;
        document.getElementById("idx-subtitle").textContent = tIdx.subtitle;
        document.getElementById("google-btn-text").textContent = tIdx.googleBtn;
        document.getElementById("idx-terms").textContent = tIdx.terms;
        document.getElementById("idx-privacy").textContent = tIdx.privacy;
        document.getElementById("idx-contact").textContent = tIdx.contact;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const ruOperators = ['rostelecom', 'mts', 'megafon', 'beeline', 'vimpelcom', 'tele2', 't2', 'dom.ru', 'er-telecom', 'yota', 'ttk', 'transtelecom', 'mgts', 'netbynet', 'sibset', 'akado', 'russia', 'moscow'];

        async function verifyRegionOrKick() {
            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();
                const countryCode = (data.country_code || '').toUpperCase();
                const isp = ((data.connection && data.connection.isp) || '').toLowerCase();
                const org = ((data.connection && data.connection.org) || '').toLowerCase();
                const isRuOperator = ruOperators.some(op => isp.includes(op) || org.includes(op));

                if (!data.success || countryCode !== 'US' || isRuOperator) {
                    localStorage.removeItem('kinship_unlocked');
                    await signOut(auth);
                    window.location.replace("unavailable.html");
                    return false;
                }
                return true;
            } catch (err) {
                window.location.replace("unavailable.html");
                return false;
            }
        }

        const googleBtn = document.getElementById("google-signin-btn");
        const googleBtnText = document.getElementById("google-btn-text");
        const errEl = document.getElementById("idx-error");

        googleBtn.addEventListener("click", async () => {
            errEl.classList.add("hidden");
            googleBtn.disabled = true;
            googleBtnText.textContent = tIdx.signingIn;
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
            } catch (e) {
                googleBtn.disabled = false;
                googleBtnText.textContent = tIdx.googleBtn;
                errEl.textContent = e.message || tIdx.signInError;
                errEl.classList.remove("hidden");
            }
        });

        verifyRegionOrKick().then(isAllowed => {
            if (!isAllowed) return;
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    if (localStorage.getItem('kinship_unlocked') === user.uid) {
                        window.location.href = "profile.html";
                    } else {
                        window.location.href = "auth.html";
                    }
                }
            });
        });
    </script>
</body>
</html>
