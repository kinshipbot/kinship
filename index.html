<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="udnUHBFzL2Us47m9qxyJWabmzRHfYsnHBpyANc-sgqI" />
    <title class="notranslate">Kinship</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --subtle: #6b7280;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --btn-hover: #1f2937;
            --secondary-btn-bg: #f3f4f6;
            --secondary-btn-text: #374151;
            --secondary-btn-hover: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --subtle: #6b7280;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --btn-hover: #e5e7eb;
                --secondary-btn-bg: #1f2937;
                --secondary-btn-text: #d1d5db;
                --secondary-btn-hover: #374151;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 390px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .brand {
            font-size: 12px;
            font-weight: 700;
            color: var(--subtle);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 22px;
        }
        .primary-btn {
            display: block;
            width: 100%;
            text-decoration: none;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.12s ease;
        }
        .primary-btn:hover {
            background-color: var(--btn-hover);
        }
        .primary-btn:active {
            transform: scale(0.98);
        }
        .secondary-btn {
            display: block;
            width: 100%;
            text-decoration: none;
            background-color: var(--secondary-btn-bg);
            color: var(--secondary-btn-text);
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease, transform 0.12s ease;
        }
        .secondary-btn:hover {
            background-color: var(--secondary-btn-hover);
        }
        .secondary-btn:active {
            transform: scale(0.98);
        }
        footer {
            font-size: 11px;
            color: var(--subtle);
        }
    </style>
</head>
<body>
    <div style="height: 12px;"></div>

    <div class="container card">
        <p class="brand notranslate">Kinship</p>
        <h1 class="notranslate">Kinship</h1>
        <p id="index-subtitle" class="subtitle">
            Sign in or continue to your account.
        </p>
        <a id="btn-go-auth" href="auth.html" class="primary-btn">Continue</a>
        <a id="btn-go-qr" href="qr-login.html" class="secondary-btn">QR Sign In</a>
    </div>

    <footer>
        <p>&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

    <script>
        const i18nIndex = {
            en: {
                lang: "en",
                subtitle: "Sign in or continue to your account.",
                continueBtn: "Continue",
                qrBtn: "QR Sign In"
            },
            ru: {
                lang: "ru",
                subtitle: "Войдите или перейдите в свой аккаунт.",
                continueBtn: "Продолжить",
                qrBtn: "Вход по QR-коду"
            },
            de: {
                lang: "de",
                subtitle: "Melde dich an oder fahre mit deinem Konto fort.",
                continueBtn: "Weiter",
                qrBtn: "QR-Login"
            }
        };

        function detectAppLang() {
            const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"])
                .map(l => String(l).toLowerCase());
            if (list.some(l => l === "ru" || l.startsWith("ru-"))) return "ru";
            if (list.some(l => l === "de" || l.startsWith("de-"))) return "de";
            return "en";
        }

        const tIdx = i18nIndex[detectAppLang()];
        document.documentElement.lang = tIdx.lang;
        document.getElementById("index-subtitle").textContent = tIdx.subtitle;
        document.getElementById("btn-go-auth").textContent = tIdx.continueBtn;
        document.getElementById("btn-go-qr").textContent = tIdx.qrBtn;
    </script>
</body>
</html>
