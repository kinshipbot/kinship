<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Your Inner Circle</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --text: #030712;
            --muted: #4b5563;
            --subtle: #9ca3af;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --btn-hover: #1f2937;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --text: #ffffff;
                --muted: #9ca3af;
                --subtle: #6b7280;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --btn-hover: #e5e7eb;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .container {
            max-width: 380px;
            width: 100%;
        }
        .brand {
            font-size: 12px;
            font-weight: 700;
            color: var(--subtle);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        .desc {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .google-btn {
            width: 100%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s ease, background-color 0.2s ease;
        }
        .google-btn:hover {
            background-color: var(--btn-hover);
        }
        .google-btn:active {
            transform: scale(0.98);
        }
        .google-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        footer {
            font-size: 12px;
            color: var(--subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer-links {
            display: flex;
            gap: 14px;
        }
        .footer-links a {
            color: var(--subtle);
            text-decoration: none;
        }
        .footer-links a:hover {
            color: var(--text);
        }
        .copy {
            font-size: 11px;
            opacity: 0.7;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .anim-1 { opacity: 0; animation: fadeUp 0.7s ease forwards; }
        .anim-2 { opacity: 0; animation: fadeUp 0.7s ease 0.15s forwards; }
        .anim-3 { opacity: 0; animation: fadeUp 0.7s ease 0.3s forwards; }
    </style>
</head>
<body>

    <div style="height: 16px;"></div>

    <!-- Экран проверки региона -->
    <div id="geo-loading" class="container">
        <p class="brand notranslate">Kinship</p>
        <p class="desc" style="margin-bottom: 0;">Checking region availability...</p>
    </div>

    <!-- Основной экран входа (только США) -->
    <div id="main-welcome" class="container hidden">
        <p class="brand anim-1 notranslate">Kinship</p>
        <h1 class="anim-1">Welcome!</h1>
        <p class="desc anim-2">
            Where you discover memes, follow trends, chat, share, like, and comment with your circle.
        </p>

        <button id="login-btn" class="google-btn anim-3">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </button>
    </div>

    <footer>
        <div class="footer-links">
            <a href="legal.html?tab=terms">Terms</a>
            <span>•</span>
            <a href="legal.html?tab=privacy">Privacy</a>
            <span>•</span>
            <a href="legal.html?tab=contact">Contact</a>
        </div>
        <p class="copy">&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const ruOperators = ['rostelecom', 'mts', 'megafon', 'beeline', 'vimpelcom', 'tele2', 't2', 'dom.ru', 'er-telecom', 'yota', 'ttk', 'transtelecom', 'mgts', 'netbynet', 'sibset', 'akado', 'russia', 'moscow'];
        let isAllowedRegion = false;

        async function checkRegion() {
            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();

                const countryCode = (data.country_code || '').toUpperCase();
                const isp = ((data.connection && data.connection.isp) || '').toLowerCase();
                const org = ((data.connection && data.connection.org) || '').toLowerCase();

                const isRuOperator = ruOperators.some(op => isp.includes(op) || org.includes(op));

                if (data.success && countryCode === 'US' && !isRuOperator) {
                    isAllowedRegion = true;
                    document.getElementById('geo-loading').classList.add('hidden');
                    document.getElementById('main-welcome').classList.remove('hidden');
                    initAuthFlow();
                } else {
                    window.location.replace("unavailable.html");
                }
            } catch (err) {
                window.location.replace("unavailable.html");
            }
        }

        function initAuthFlow() {
            if (!isAllowedRegion) return;

            getRedirectResult(auth).then((result) => {
                if (result && result.user && isAllowedRegion) {
                    window.location.href = "auth.html";
                }
            }).catch((error) => {
                alert("Auth error: " + error.message);
            });

            onAuthStateChanged(auth, (user) => {
                if (user && isAllowedRegion) {
                    window.location.href = "auth.html";
                }
            });
        }

        document.getElementById('login-btn').addEventListener('click', async () => {
            if (!isAllowedRegion) return;
            try {
                await signInWithPopup(auth, provider);
                window.location.href = "auth.html";
            } catch (error) {
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request' || /Mobi|Android/i.test(navigator.userAgent)) {
                    await signInWithRedirect(auth, provider);
                } else {
                    alert("Auth error: " + error.message);
                }
            }
        });

        checkRegion();
    </script>
</body>
</html>
