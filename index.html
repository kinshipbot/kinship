<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Your Inner Circle</title>
    <meta name="description" content="Connect, share memes, catch trends, and vibe with your inner circle.">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kinship">
    <meta property="og:description" content="Where you meet memes, trends, chat, share, like, and comment.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *, body, h1, h2, p, button, a {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }
        h1, h2 { font-weight: 800 !important; }
        p { font-weight: 500 !important; }
        button { font-weight: 700 !important; }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .smooth-title { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .smooth-desc { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards; }
        .smooth-btn { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between items-center p-6 m-0 text-center">

    <!-- Top Spacer -->
    <div class="h-4"></div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="max-w-sm w-full">
        <p class="text-xs text-gray-500 uppercase tracking-widest mb-4 smooth-title notranslate">Kinship</p>
        <h1 class="smooth-title text-2xl text-white mb-3 tracking-tight">Добро пожаловать!</h1>
        <p class="smooth-desc text-sm text-gray-400 leading-relaxed mb-8">
            Место, где можно находить мемы, следить за трендами, общаться и делиться впечатлениями с близким кругом.
        </p>

        <button id="login-btn" class="smooth-btn w-full bg-white text-black p-3.5 rounded-xl text-sm hover:bg-gray-200 transition flex items-center justify-center gap-2.5 cursor-pointer shadow-lg">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Войти через Google
        </button>
    </div>

    <!-- Profile Screen -->
    <div id="profile-screen" class="hidden max-w-sm w-full bg-gray-900 border border-gray-800 p-6 rounded-2xl">
        <img id="user-avatar" src="" alt="Avatar" class="w-16 h-16 rounded-full mx-auto mb-3 border border-gray-700">
        <h2 id="user-name" class="text-lg text-white mb-1"></h2>
        <p id="user-email" class="text-xs text-gray-400 mb-2"></p>
        <p id="db-status" class="text-xs text-emerald-400 mb-6">Синхронизация с облаком...</p>
        <button id="logout-btn" class="w-full bg-gray-800 text-gray-300 p-3 rounded-xl text-xs hover:bg-gray-700 transition cursor-pointer">
            Выйти
        </button>
    </div>

    <!-- Minimalist Western-style Footer -->
    <footer class="text-xs text-gray-600 flex flex-col items-center gap-1.5">
        <div class="flex gap-4">
            <button onclick="openModal('Условия использования', 'Kinship находится в режиме закрытого бета-тестирования. Будьте уважительны, делитесь хорошим вайбом и берегите сообщество.')" class="hover:text-gray-400 transition font-normal cursor-pointer">Условия</button>
            <span>•</span>
            <button onclick="openModal('Политика конфиденциальности', 'Мы используем только ваше имя профиля Google, email и аватарку для авторизации и синхронизации активности в реальном времени.')" class="hover:text-gray-400 transition font-normal cursor-pointer конфиденциальность">Конфиденциальность</button>
            <span>•</span>
            <a href="mailto:hello@kinship.app" class="hover:text-gray-400 transition font-normal">Контакты</a>
        </div>
        <p class="text-[11px] text-gray-700 font-normal">&copy; 2026 <span class="notranslate">Kinship</span> Inc. Все права защищены.</p>
    </footer>

    <!-- Legal Modal -->
    <div id="legal-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-6 z-50">
        <div class="bg-gray-900 border border-gray-800 max-w-xs w-full p-5 rounded-2xl text-left">
            <h3 id="modal-title" class="text-sm font-bold text-white mb-2"></h3>
            <p id="modal-body" class="text-xs text-gray-400 leading-relaxed mb-4"></p>
            <button onclick="closeModal()" class="w-full bg-white text-black py-2 rounded-lg text-xs cursor-pointer hover:bg-gray-200 transition">Понятно</button>
        </div>
    </div>

    <script>
        function openModal(title, text) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = text;
            document.getElementById('legal-modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('legal-modal').classList.add('hidden');
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const authScreen = document.getElementById('auth-screen');
        const profileScreen = document.getElementById('profile-screen');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const dbStatus = document.getElementById('db-status');

        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Ошибка входа: " + error.message);
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authScreen.classList.add('hidden');
                profileScreen.classList.remove('hidden');
                document.getElementById('user-avatar').src = user.photoURL || 'https://via.placeholder.com/64';
                document.getElementById('user-name').textContent = user.displayName || 'Участник';
                document.getElementById('user-email').textContent = user.email;

                try {
                    await setDoc(doc(db, "users", user.uid), {
                        name: user.displayName,
                        email: user.email,
                        photo: user.photoURL,
                        lastLogin: serverTimestamp()
                    }, { merge: true });
                    dbStatus.textContent = "Синхронизировано с облаком ✓";
                } catch (e) {
                    dbStatus.textContent = "Ошибка синхронизации: " + e.message;
                    dbStatus.classList.replace('text-emerald-400', 'text-red-400');
                }
            } else {
                profileScreen.classList.add('hidden');
                authScreen.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
