<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Your Inner Circle</title>
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="description" content="Connect, share memes, catch trends, and vibe with your inner circle.">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kinship">
    <meta property="og:description" content="Where you meet memes, trends, chat, share, like, and comment.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *, body, h1, h2, p, button, a, input, label, select {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }
        h1, h2 { font-weight: 800 !important; }
        p { font-weight: 500 !important; }
        button { font-weight: 700 !important; }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .smooth-title { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .smooth-desc { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards; }
        .smooth-btn { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-950 dark:bg-gray-950 dark:text-white min-h-screen flex flex-col justify-between items-center p-6 m-0 text-center transition-colors duration-300">

    <!-- Top Spacer -->
    <div class="h-4"></div>

    <!-- 1. Auth Screen -->
    <div id="auth-screen" class="max-w-sm w-full">
        <p class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4 smooth-title notranslate">Kinship</p>
        <h1 class="smooth-title text-2xl text-gray-950 dark:text-white mb-3 tracking-tight">Welcome!</h1>
        <p class="smooth-desc text-sm text-gray-600 dark:text-gray-400 leading-relaxed mb-8">
            Where you discover memes, follow trends, chat, share, like, and comment with your circle.
        </p>

        <button id="login-btn" class="smooth-btn w-full bg-gray-950 text-white hover:bg-gray-800 dark:bg-white dark:text-black dark:hover:bg-gray-200 p-3.5 rounded-xl text-sm transition flex items-center justify-center gap-2.5 cursor-pointer shadow-lg">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </button>
    </div>

    <!-- 2. Loading Screen -->
    <div id="loading-screen" class="hidden max-w-sm w-full">
        <p class="text-sm text-gray-500 dark:text-gray-400">Проверка данных в облаке...</p>
    </div>

    <!-- 3. Registration Setup Screen -->
    <div id="register-screen" class="hidden max-w-sm w-full bg-white border-gray-200 dark:bg-gray-900 border dark:border-gray-800 p-6 rounded-2xl shadow-sm text-left">
        <h2 class="text-lg text-gray-950 dark:text-white mb-1 text-center">Завершение регистрации</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-5 text-center">Заполните данные для создания профиля</p>

        <div class="space-y-3 mb-5">
            <div>
                <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Никнейм</label>
                <input id="reg-nickname" type="text" placeholder="Ваш никнейм" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm text-gray-950 dark:text-white outline-none">
            </div>

            <div>
                <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Дата рождения (введите или выберите)</label>
                <input id="reg-dob-text" type="text" inputmode="numeric" maxlength="10" placeholder="дд.мм.гггг" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm text-gray-950 dark:text-white outline-none mb-2">
                <div class="grid grid-cols-3 gap-2">
                    <select id="reg-day" class="bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-2.5 text-xs text-gray-950 dark:text-white outline-none">
                        <option value="">День</option>
                    </select>
                    <select id="reg-month" class="bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-2.5 text-xs text-gray-950 dark:text-white outline-none">
                        <option value="">Месяц</option>
                        <option value="01">Январь</option>
                        <option value="02">Февраль</option>
                        <option value="03">Март</option>
                        <option value="04">Апрель</option>
                        <option value="05">Май</option>
                        <option value="06">Июнь</option>
                        <option value="07">Июль</option>
                        <option value="08">Август</option>
                        <option value="09">Сентябрь</option>
                        <option value="10">Октябрь</option>
                        <option value="11">Ноябрь</option>
                        <option value="12">Декабрь</option>
                    </select>
                    <select id="reg-year" class="bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-2.5 text-xs text-gray-950 dark:text-white outline-none">
                        <option value="">Год</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Придумайте пароль</label>
                <input id="reg-pass" type="password" placeholder="Введите пароль" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm text-gray-950 dark:text-white outline-none">
            </div>

            <div>
                <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Повторите пароль</label>
                <input id="reg-pass-confirm" type="password" placeholder="Повторите пароль" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm text-gray-950 dark:text-white outline-none">
            </div>
        </div>

        <p id="reg-error" class="hidden text-xs text-red-500 mb-3 text-center"></p>

        <button id="reg-submit-btn" class="w-full bg-gray-950 text-white hover:bg-gray-800 dark:bg-white dark:text-black dark:hover:bg-gray-200 p-3 rounded-xl text-sm transition cursor-pointer mb-2">
            Сохранить и войти
        </button>
        <button id="reg-cancel-btn" class="w-full bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 p-2.5 rounded-xl text-xs transition cursor-pointer">
            Отмена
        </button>
    </div>

    <!-- 4. Password Check Screen -->
    <div id="password-screen" class="hidden max-w-sm w-full bg-white border-gray-200 dark:bg-gray-900 border dark:border-gray-800 p-6 rounded-2xl shadow-sm text-left">
        <h2 class="text-lg text-gray-950 dark:text-white mb-1 text-center">Подтверждение входа</h2>
        <p id="login-hint-email" class="text-xs text-gray-500 dark:text-gray-400 mb-5 text-center"></p>

        <div class="mb-4">
            <label class="block text-xs text-gray-600 dark:text-gray-400 mb-1">Пароль</label>
            <input id="login-pass" type="password" placeholder="Введите ваш пароль" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm text-gray-950 dark:text-white outline-none">
        </div>

        <p id="login-pass-error" class="hidden text-xs text-red-500 mb-3 text-center"></p>

        <button id="login-pass-btn" class="w-full bg-gray-950 text-white hover:bg-gray-800 dark:bg-white dark:text-black dark:hover:bg-gray-200 p-3 rounded-xl text-sm transition cursor-pointer mb-2">
            Войти
        </button>
        <button id="login-pass-logout-btn" class="w-full bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 p-2.5 rounded-xl text-xs transition cursor-pointer">
            Выйти из аккаунта
        </button>
    </div>

    <!-- 5. Profile Screen -->
    <div id="profile-screen" class="hidden max-w-sm w-full bg-white border-gray-200 dark:bg-gray-900 border dark:border-gray-800 p-6 rounded-2xl shadow-sm">
        <img id="user-avatar" src="" alt="Avatar" class="w-16 h-16 rounded-full mx-auto mb-3 border border-gray-200 dark:border-gray-700">
        <h2 id="welcome-greeting" class="text-lg text-gray-950 dark:text-white mb-1"></h2>
        <p id="user-email" class="text-xs text-gray-500 dark:text-gray-400 mb-2"></p>
        <p id="db-status" class="text-xs text-emerald-600 dark:text-emerald-400 mb-6">Synced with cloud ✓</p>
        
        <div class="space-y-2">
            <button id="logout-btn" class="w-full bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 p-3 rounded-xl text-xs transition cursor-pointer">
                Выход
            </button>
            <button id="delete-account-btn" class="w-full bg-red-500/10 text-red-600 hover:bg-red-500/20 dark:text-red-400 p-3 rounded-xl text-xs transition cursor-pointer">
                Удалить аккаунт
            </button>
        </div>
    </div>

    <!-- Minimalist Western-style Footer -->
    <footer class="text-xs text-gray-500 dark:text-gray-600 flex flex-col items-center gap-1.5">
        <div class="flex gap-4">
            <button onclick="openModal('Terms of Service', 'Kinship is currently in private beta. Be respectful, share good vibes, and keep the community safe.')" class="hover:text-gray-800 dark:hover:text-gray-400 transition font-normal cursor-pointer">Terms</button>
            <span>•</span>
            <button onclick="openModal('Privacy Policy', 'We only use your Google profile name, email, and avatar to authenticate your account and sync your activity in real time.')" class="hover:text-gray-800 dark:hover:text-gray-400 transition font-normal cursor-pointer">Privacy</button>
            <span>•</span>
            <a href="mailto:hello@kinship.app" class="hover:text-gray-800 dark:hover:text-gray-400 transition font-normal">Contact</a>
        </div>
        <p class="text-[11px] text-gray-400 dark:text-gray-700 font-normal">&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

    <!-- Legal Modal -->
    <div id="legal-modal" class="hidden fixed inset-0 bg-black/50 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-6 z-50">
        <div class="bg-white border-gray-200 dark:bg-gray-900 border dark:border-gray-800 max-w-xs w-full p-5 rounded-2xl text-left shadow-xl">
            <h3 id="modal-title" class="text-sm font-bold text-gray-950 dark:text-white mb-2"></h3>
            <p id="modal-body" class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed mb-4"></p>
            <button onclick="closeModal()" class="w-full bg-gray-950 text-white hover:bg-gray-800 dark:bg-white dark:text-black dark:hover:bg-gray-200 py-2 rounded-lg text-xs cursor-pointer transition">Got it</button>
        </div>
    </div>

    <script>
        function openModal(title, text) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = text;
            document.getElementById('legal-modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('legal-modal').classList.add('hidden');
        }

        // Заполнение выпадающих списков дня и года
        const daySelect = document.getElementById('reg-day');
        const monthSelect = document.getElementById('reg-month');
        const yearSelect = document.getElementById('reg-year');
        const dobText = document.getElementById('reg-dob-text');

        for (let d = 1; d <= 31; d++) {
            const val = String(d).padStart(2, '0');
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = d;
            daySelect.appendChild(opt);
        }

        const currentYear = new Date().getFullYear();
        for (let y = currentYear; y >= 1920; y--) {
            const opt = document.createElement('option');
            opt.value = String(y);
            opt.textContent = y;
            yearSelect.appendChild(opt);
        }

        // Синхронизация выпадающих списков -> текстовое поле дд.мм.гггг
        function syncSelectsToText() {
            const d = daySelect.value;
            const m = monthSelect.value;
            const y = yearSelect.value;
            if (d && m && y) {
                dobText.value = `${d}.${m}.${y}`;
            }
        }
        daySelect.addEventListener('change', syncSelectsToText);
        monthSelect.addEventListener('change', syncSelectsToText);
        yearSelect.addEventListener('change', syncSelectsToText);

        // Автоформатирование и синхронизация текстового поля дд.мм.гггг -> выпадающие списки
        dobText.addEventListener('input', (e) => {
            let digits = e.target.value.replace(/\D/g, '').slice(0, 8);
            let formatted = digits;
            if (digits.length > 4) {
                formatted = `${digits.slice(0, 2)}.${digits.slice(2, 4)}.${digits.slice(4)}`;
            } else if (digits.length > 2) {
                formatted = `${digits.slice(0, 2)}.${digits.slice(2)}`;
            }
            e.target.value = formatted;

            if (digits.length === 8) {
                const d = digits.slice(0, 2);
                const m = digits.slice(2, 4);
                const y = digits.slice(4, 8);
                if ([...daySelect.options].some(o => o.value === d)) daySelect.value = d;
                if ([...monthSelect.options].some(o => o.value === m)) monthSelect.value = m;
                if ([...yearSelect.options].some(o => o.value === y)) yearSelect.value = y;
            }
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { initializeFirestore, doc, getDoc, setDoc, deleteDoc, getDocs, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = initializeFirestore(app, {
            experimentalForceLongPolling: true
        });
        const provider = new GoogleAuthProvider();

        const MAX_USERS = 100;

        const screens = {
            auth: document.getElementById('auth-screen'),
            loading: document.getElementById('loading-screen'),
            register: document.getElementById('register-screen'),
            password: document.getElementById('password-screen'),
            profile: document.getElementById('profile-screen')
        };

        function showScreen(name) {
            Object.values(screens).forEach(el => el.classList.add('hidden'));
            screens[name].classList.remove('hidden');
        }

        let currentUser = null;
        let savedUserData = null;

        getRedirectResult(auth).catch((error) => {
            alert("Ошибка возврата после входа: " + error.message);
        });

        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request' || /Mobi|Android/i.test(navigator.userAgent)) {
                    await signInWithRedirect(auth, provider);
                } else {
                    alert("Ошибка входа: " + error.message);
                }
            }
        });

        const handleLogout = () => {
            currentUser = null;
            savedUserData = null;
            signOut(auth);
        };

        document.getElementById('logout-btn').addEventListener('click', handleLogout);
        document.getElementById('reg-cancel-btn').addEventListener('click', handleLogout);
        document.getElementById('login-pass-logout-btn').addEventListener('click', handleLogout);

        // Удаление аккаунта из базы данных и освобождение места в лимите
        document.getElementById('delete-account-btn').addEventListener('click', async () => {
            if (!currentUser) return;
            if (!confirm("Вы уверены, что хотите удалить аккаунт? Все ваши данные будут удалены, и место на сервере освободится.")) {
                return;
            }
            try {
                showScreen('loading');
                await deleteDoc(doc(db, "users", currentUser.uid));
                handleLogout();
            } catch (e) {
                showScreen('profile');
                alert("Ошибка при удалении аккаунта: " + e.message);
            }
        });

        function openProfile(user, nickname) {
            document.getElementById('user-avatar').src = user.photoURL || 'https://via.placeholder.com/64';
            document.getElementById('welcome-greeting').textContent = `С возвращением, ${nickname}!`;
            document.getElementById('user-email').textContent = user.email;
            showScreen('profile');
        }

        function isValidDateString(str) {
            const match = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(str);
            if (!match) return false;
            const day = parseInt(match[1], 10);
            const month = parseInt(match[2], 10);
            const year = parseInt(match[3], 10);
            if (month < 1 || month > 12 || day < 1 || day > 31 || year < 1900 || year > new Date().getFullYear()) return false;
            const date = new Date(year, month - 1, day);
            return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
        }

        // Сохранение при регистрации
        document.getElementById('reg-submit-btn').addEventListener('click', async () => {
    const nickname = document.getElementById('reg-nickname').value.trim();
    const dob = document.getElementById('reg-dob-text').value.trim();
    const pass = document.getElementById('reg-pass').value;
    const passConfirm = document.getElementById('reg-pass-confirm').value;
    const errEl = document.getElementById('reg-error');

    errEl.classList.add('hidden');

    if (!nickname) {
        errEl.textContent = "Укажите никнейм.";
        errEl.classList.remove('hidden');
        return;
    }
    if (!isValidDateString(dob)) {
        errEl.textContent = "Укажите корректную дату рождения в формате дд.мм.гггг.";
        errEl.classList.remove('hidden');
        return;
    }
    if (!pass) {
        errEl.textContent = "Придумайте пароль.";
        errEl.classList.remove('hidden');
        return;
    }
    if (pass !== passConfirm) {
        errEl.textContent = "Пароли не совпадают.";
        errEl.classList.remove('hidden');
        return;
    }

    try {
        showScreen('loading');
        const userRef = doc(db, "users", currentUser.uid);

        await setDoc(userRef, {
            nickname: nickname,
            email: currentUser.email,
            photo: currentUser.photoURL,
            dob: dob,
            password: pass,
            lastLogin: serverTimestamp()
        });

        openProfile(currentUser, nickname);
    } catch (e) {
        showScreen('register');
        errEl.textContent = "Ошибка облака: " + e.message;
        errEl.classList.remove('hidden');
    }
});

// Проверка пароля при повторном входе
document.getElementById('login-pass-btn').addEventListener('click', async () => {
    const enteredPass = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-pass-error');

    errEl.classList.add('hidden');

    if (!enteredPass) {
        errEl.textContent = "Введите пароль.";
        errEl.classList.remove('hidden');
        return;
    }

    if (savedUserData && enteredPass === savedUserData.password) {
        try {
            showScreen('loading');
            const userRef = doc(db, "users", currentUser.uid);
            await setDoc(userRef, { lastLogin: serverTimestamp() }, { merge: true });
            const nick = savedUserData.nickname || savedUserData.name || currentUser.displayName || 'User';
            openProfile(currentUser, nick);
        } catch (e) {
            showScreen('password');
            errEl.textContent = "Ошибка облака: " + e.message;
            errEl.classList.remove('hidden');
        }
    } else {
        errEl.textContent = "Неверный пароль.";
        errEl.classList.remove('hidden');
    }
});

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        showScreen('loading');

        try {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                const usersSnapshot = await getDocs(collection(db, "users"));
                if (usersSnapshot.size >= MAX_USERS) {
                    alert(`Лимит исчерпан: в базе может быть максимум ${MAX_USERS} аккаунтов.`);
                    handleLogout();
                    return;
                }
                document.getElementById('reg-nickname').value = user.displayName || '';
                document.getElementById('reg-dob-text').value = '';
                document.getElementById('reg-day').value = '';
                document.getElementById('reg-month').value = '';
                document.getElementById('reg-year').value = '';
                document.getElementById('reg-pass').value = '';
                document.getElementById('reg-pass-confirm').value = '';
                document.getElementById('reg-error').classList.add('hidden');
                showScreen('register');
            } else {
                savedUserData = userSnap.data();
                if (!savedUserData.password) {
                    document.getElementById('reg-nickname').value = savedUserData.nickname || savedUserData.name || user.displayName || '';
                    showScreen('register');
                } else {
                    document.getElementById('login-hint-email').textContent = user.email;
                    document.getElementById('login-pass').value = '';
                    document.getElementById('login-pass-error').classList.add('hidden');
                    showScreen('password');
                }
            }
        } catch (e) {
            alert("Ошибка облачного сервиса: " + e.message);
            handleLogout();
        }
    } else {
        showScreen('auth');
    }
});
     </script>
</body>
</html>
