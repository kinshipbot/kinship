<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Ожидание подтверждения</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --secondary-bg: #f3f4f6;
            --warn: #f59e0b;
            --ok: #10b981;
            --err: #ef4444;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --secondary-bg: #1f2937;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 22px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
        .loader {
            width: 42px;
            height: 42px;
            border: 4px solid var(--secondary-bg);
            border-top-color: var(--text);
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: spin 0.85s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--secondary-bg);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--warn);
        }
        .dot.ok { background: var(--ok); }
        .dot.err { background: var(--err); }
        .back-link {
            display: inline-block;
            text-decoration: none;
            color: var(--muted);
            background: var(--secondary-bg);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="spinner" class="loader"></div>
        <h1 id="title">Ожидание подтверждения</h1>
        <p id="desc" class="desc">
            Подтвердите вход на другом устройстве. Как только вход будет принят, вы автоматически перейдёте в профиль.
        </p>

        <div class="status-pill">
            <span id="dot" class="dot"></span>
            <span id="status-text">Ожидание решения с другого устройства...</span>
        </div>

        <div>
            <a href="qr-scan.html" class="back-link">← Вернуться к сканеру</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            databaseURL: "https://kinship-1a33b-default-rtdb.firebaseio.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        const code = (params.get("code") || "").toUpperCase();

        const dot = document.getElementById("dot");
        const statusText = document.getElementById("status-text");
        const descEl = document.getElementById("desc");
        const spinner = document.getElementById("spinner");

        async function watchSession() {
            if (!code) {
                window.location.href = "qr-scan.html";
                return;
            }

            const sessionRef = ref(db, "qr_sessions/" + code);
            const initialSnap = await get(sessionRef);

            if (!initialSnap.exists()) {
                dot.className = "dot err";
                spinner.style.display = "none";
                statusText.textContent = "Сессия не найдена в базе";
                descEl.textContent = "Нельзя войти по несуществующему коду.";
                return;
            }

            onValue(sessionRef, (snap) => {
                const data = snap.val();
                if (!data) return;

                if (data.status === "approved") {
                    dot.className = "dot ok";
                    spinner.style.display = "none";
                    statusText.textContent = "Вход подтверждён!";
                    descEl.textContent = "Переход в профиль...";

                    if (data.uid) localStorage.setItem("kinship_uid", data.uid);
                    if (data.userName) localStorage.setItem("kinship_user_name", data.userName);
                    if (data.userHandle) localStorage.setItem("kinship_user_handle", data.userHandle);

                    setTimeout(() => {
                        window.location.href = "profile.html";
                    }, 600);
                } else if (data.status === "rejected") {
                    dot.className = "dot err";
                    spinner.style.display = "none";
                    statusText.textContent = "Вход отклонён";
                    descEl.textContent = "Подтверждение на другом устройстве было отклонено.";
                }
            });
        }

        watchSession();
    </script>
</body>
</html>
