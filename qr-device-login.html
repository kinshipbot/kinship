<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Waiting for Confirmation</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --subtle: #6b7280;
            --input-bg: #f9fafb;
            --input-border: #d1d5db;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --btn-hover: #1f2937;
            --secondary-btn-bg: #f3f4f6;
            --secondary-btn-text: #374151;
            --secondary-btn-hover: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --subtle: #6b7280;
                --input-bg: #1f2937;
                --input-border: #374151;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --btn-hover: #e5e7eb;
                --secondary-btn-bg: #1f2937;
                --secondary-btn-text: #d1d5db;
                --secondary-btn-hover: #374151;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .container {
            max-width: 390px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .brand {
            font-size: 12px;
            font-weight: 700;
            color: var(--subtle);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 14px;
        }
        h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .subtitle {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .info-box {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            text-align: left;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .info-label {
            color: var(--muted);
            font-weight: 600;
        }
        .info-val {
            color: var(--text);
            font-weight: 700;
            text-align: right;
            word-break: break-word;
        }
        .primary-btn {
            width: 100%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }
        .primary-btn:hover {
            background-color: var(--btn-hover);
        }
        .secondary-btn {
            width: 100%;
            background-color: var(--secondary-btn-bg);
            color: var(--secondary-btn-text);
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease;
        }
        .secondary-btn:hover {
            background-color: var(--secondary-btn-hover);
        }
        .msg-ok {
            font-size: 12px;
            color: #10b981;
            font-weight: 600;
            margin-top: 12px;
        }
        .msg-err {
            font-size: 12px;
            color: #ef4444;
            font-weight: 600;
            margin-top: 12px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--input-border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        footer {
            font-size: 11px;
            color: var(--subtle);
        }
    </style>
</head>
<body>

    <div style="height: 12px;"></div>

    <div id="dev-qr-card" class="container card">
        <p class="brand notranslate">Kinship</p>
        <div id="dev-qr-spinner" class="spinner"></div>
        <h2 id="dev-qr-title">Waiting for Confirmation</h2>
        <p id="dev-qr-subtitle" class="subtitle">
            We sent a sign-in request to your main device. Tap Confirm there to sign in on this device.
        </p>

        <div class="info-box">
            <div class="info-row">
                <span id="lbl-dev-nick" class="info-label">Account</span>
                <span id="val-dev-nick" class="info-val">—</span>
            </div>
            <div class="info-row">
                <span id="lbl-dev-name" class="info-label">This Device</span>
                <span id="val-dev-name" class="info-val">—</span>
            </div>
            <div class="info-row">
                <span id="lbl-dev-ip" class="info-label">IP</span>
                <span id="val-dev-ip" class="info-val">—</span>
            </div>
        </div>

        <button id="btn-back-auth" type="button" class="secondary-btn">Back to Sign In</button>
        <p id="dev-qr-status" class="hidden"></p>
    </div>

    <footer>
        <p>&copy; 2026 <span class="notranslate">Kinship</span> Inc. All rights reserved.</p>
    </footer>

    <script>
        const i18nDevQr = {
            en: {
                lang: "en",
                title: "Waiting for Confirmation",
                subtitle: "We sent a sign-in request to your main device. Tap Confirm there to sign in on this device.",
                lblNick: "Account",
                lblDevice: "This Device",
                lblIp: "IP",
                ipUnknown: "Unknown",
                deviceUnknown: "Unknown device",
                backAuth: "Back to Sign In",
                invalidQr: "Missing or invalid QR parameters. Please scan a valid account QR code.",
                approvedMsg: "Confirmed! Signing you in to the account...",
                declinedMsg: "Sign-in request was declined on the main device.",
                sendErr: "Failed to send sign-in request."
            },
            ru: {
                lang: "ru",
                title: "Ожидание подтверждения",
                subtitle: "Мы отправили запрос на вход на ваше основное устройство. Нажмите «Подтвердить» там, чтобы войти на этом устройстве.",
                lblNick: "Аккаунт",
                lblDevice: "Это устройство",
                lblIp: "IP",
                ipUnknown: "Неизвестен",
                deviceUnknown: "Неизвестное устройство",
                backAuth: "Назад ко входу",
                invalidQr: "Неверные или неполные данные QR-кода. Отсканируйте QR-код аккаунта заново.",
                approvedMsg: "Подтверждено! Выполняем вход в аккаунт...",
                declinedMsg: "Запрос на вход был отклонён на основном устройстве.",
                sendErr: "Не удалось отправить запрос на вход."
            },
            de: {
                lang: "de",
                title: "Warten auf Bestätigung",
                subtitle: "Wir haben eine Anmeldeanfrage an dein Hauptgerät gesendet. Tippe dort auf Bestätigen, um dich hier anzumelden.",
                lblNick: "Konto",
                lblDevice: "Dieses Gerät",
                lblIp: "IP",
                ipUnknown: "Unbekannt",
                deviceUnknown: "Unbekanntes Gerät",
                backAuth: "Zurück zur Anmeldung",
                invalidQr: "Ungültige oder fehlende QR-Daten. Bitte scanne einen gültigen Konto-QR-Code.",
                approvedMsg: "Bestätigt! Du wirst jetzt angemeldet...",
                declinedMsg: "Die Anmeldeanfrage wurde auf dem Hauptgerät abgelehnt.",
                sendErr: "Anmeldeanfrage konnte nicht gesendet werden."
            }
        };

        function detectAppLang() {
            const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"])
                .map(l => String(l).toLowerCase());
            if (list.some(l => l === "ru" || l.startsWith("ru-"))) return "ru";
            if (list.some(l => l === "de" || l.startsWith("de-"))) return "de";
            return "en";
        }

        const tDev = i18nDevQr[detectAppLang()];
        document.documentElement.lang = tDev.lang;

        document.getElementById("dev-qr-title").textContent = tDev.title;
        document.getElementById("dev-qr-subtitle").textContent = tDev.subtitle;
        document.getElementById("lbl-dev-nick").textContent = tDev.lblNick;
        document.getElementById("lbl-dev-name").textContent = tDev.lblDevice;
        document.getElementById("lbl-dev-ip").textContent = tDev.lblIp;
        document.getElementById("btn-back-auth").textContent = tDev.backAuth;

        document.getElementById("btn-back-auth").addEventListener("click", () => {
            window.location.href = "auth.html";
        });

        function detectDeviceName() {
            const ua = navigator.userAgent || "";
            if (/Android/i.test(ua)) {
                const m = ua.match(/Android\s*([\d.]*);\s*([^;)]+)/i);
                const ver = m && m[1] ? ` ${m[1].trim()}` : "";
                let model = m && m[2] ? m[2].replace(/\s*Build\/.*/i, "").trim() : "";
                if (!model || model === "K" || /^Linux$/i.test(model)) model = "";
                return model ? `${model} (Android${ver})` : `Android${ver}`;
            }
            if (/iPhone/i.test(ua)) return "iPhone";
            if (/iPad/i.test(ua)) return "iPad";
            if (/Windows/i.test(ua)) return "Windows PC";
            if (/Mac/i.test(ua)) return "Mac";
            return tDev.deviceUnknown;
        }

        async function fetchIpAddress() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 3000);
            try {
                const res = await fetch("https://ipwho.is/", { signal: controller.signal });
                clearTimeout(timer);
                const data = await res.json();
                if (data && data.success && data.ip) return String(data.ip).trim();
            } catch (_) {
                clearTimeout(timer);
            }
            return tDev.ipUnknown;
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { initializeFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH4hOp3efR-Is4mFnT9jDxmCrKty_6dJ0",
            authDomain: "kinship-1a33b.firebaseapp.com",
            projectId: "kinship-1a33b",
            storageBucket: "kinship-1a33b.firebasestorage.app",
            messagingSenderId: "530429265638",
            appId: "1:530429265638:web:45ee33d3f9129f15d6dd27"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });
        const DEVICE_ID_KEY = "ks_device_id";

        function getOrCreateDeviceId() {
            try {
                let id = localStorage.getItem(DEVICE_ID_KEY);
                if (!id) {
                    id = "dev_" + Math.random().toString(36).slice(2, 12) + "_" + Date.now().toString(36);
                    localStorage.setItem(DEVICE_ID_KEY, id);
                }
                return id;
            } catch (_) {
                return "dev_volatile_" + Date.now().toString(36);
            }
        }

        function setStatus(msg, isErr = false) {
            const el = document.getElementById("dev-qr-status");
            el.textContent = msg;
            el.className = isErr ? "msg-err" : "msg-ok";
            el.classList.remove("hidden");
        }

        (async () => {
            const params = new URLSearchParams(window.location.search);
            const qrUid = (params.get("qrUid") || params.get("uid") || "").trim();
            const qrToken = (params.get("qrToken") || params.get("token") || "").trim();

            if (!qrUid || !qrToken) {
                document.getElementById("dev-qr-spinner").classList.add("hidden");
                setStatus(tDev.invalidQr, true);
                return;
            }

            const deviceId = getOrCreateDeviceId();
            const deviceName = detectDeviceName();
            const ip = await fetchIpAddress();

            document.getElementById("val-dev-name").textContent = deviceName;
            document.getElementById("val-dev-ip").textContent = ip;

            const userRef = doc(db, "users", qrUid);

            try {
                const snap = await getDoc(userRef);
                const data = snap.exists() ? snap.data() : {};

                if (data.nickname) {
                    document.getElementById("val-dev-nick").textContent = data.nickname;
                }

                if (data.qrLoginToken && data.qrLoginToken !== qrToken) {
                    document.getElementById("dev-qr-spinner").classList.add("hidden");
                    setStatus(tDev.invalidQr, true);
                    return;
                }

                const requestId = "req_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);

                await setDoc(userRef, {
                    qrLoginRequest: {
                        requestId,
                        token: qrToken,
                        deviceId,
                        deviceName,
                        ip,
                        status: "pending",
                        createdAt: Date.now()
                    }
                }, { merge: true });

                let completed = false;
                onSnapshot(userRef, async (docSnap) => {
                    if (completed || !docSnap.exists()) return;
                    const latest = docSnap.data();
                    const req = latest.qrLoginRequest;
                    if (!req || req.requestId !== requestId) return;

                    if (req.status === "approved") {
                        completed = true;
                        document.getElementById("dev-qr-spinner").classList.add("hidden");
                        setStatus(tDev.approvedMsg, false);

                        const curSnap = await getDoc(userRef);
                        const curData = curSnap.exists() ? curSnap.data() : {};
                        const curTrusted = Array.isArray(curData.trustedDeviceIds) ? curData.trustedDeviceIds : [];
                        const nextTrusted = Array.from(new Set([...curTrusted, deviceId]));

                        await setDoc(userRef, {
                            activeDeviceId: deviceId,
                            sessionDeviceId: deviceId,
                            revokedDeviceId: "",
                            trustedDeviceIds: nextTrusted,
                            lastDeviceName: deviceName,
                            lastLogin: serverTimestamp()
                        }, { merge: true });

                        localStorage.setItem("kinship_unlocked", qrUid);
                        setTimeout(() => {
                            window.location.href = "profile.html";
                        }, 400);
                    } else if (req.status === "declined") {
                        completed = true;
                        document.getElementById("dev-qr-spinner").classList.add("hidden");
                        setStatus(tDev.declinedMsg, true);
                    }
                });
            } catch (e) {
                document.getElementById("dev-qr-spinner").classList.add("hidden");
                setStatus(e.message || tDev.sendErr, true);
            }
        })();
    </script>
</body>
</html>
