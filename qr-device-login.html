<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="notranslate">Kinship — Подтверждение входа</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text: #030712;
            --muted: #4b5563;
            --secondary-bg: #f3f4f6;
            --btn-bg: #030712;
            --btn-text: #ffffff;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #030712;
                --card-bg: #111827;
                --card-border: #1f2937;
                --text: #ffffff;
                --muted: #9ca3af;
                --secondary-bg: #1f2937;
                --btn-bg: #ffffff;
                --btn-text: #000000;
                --danger-bg: #3f1515;
                --danger-text: #fca5a5;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 22px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
        .shield-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--secondary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        h1 {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .device-info {
            background: var(--secondary-bg);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: left;
        }
        .device-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 5px 0;
        }
        .device-row span:first-child {
            color: var(--muted);
        }
        .device-row span:last-child {
            font-weight: 700;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-approve {
            background: var(--btn-bg);
            color: var(--btn-text);
        }
        .btn-reject {
            background: var(--danger-bg);
            color: var(--danger-text);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="shield-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        </div>

        <h1>Подтверждение входа</h1>
        <p class="desc">
            Ожидание подтверждения входа с другого устройства. Подтвердите, если вы входите в аккаунт Kinship.
        </p>

        <div class="device-info">
            <div class="device-row">
                <span>Устройство:</span>
                <span id="dev-name">Проверка...</span>
            </div>
            <div class="device-row">
                <span>Код сессии:</span>
                <span id="dev-code">---</span>
            </div>
            <div class="device-row">
                <span>Статус:</span>
                <span id="dev-status">Ожидает подтверждения</span>
            </div>
        </div>

        <button id="approve-btn" class="btn btn-approve" type="button">Подтвердить вход</button>
        <button id="reject-btn" class="btn btn-reject" type="button">Отклонить вход</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // ВСТАВЬ СВОЙ FIREBASE CONFIG ИЗ ПРОЕКТА KINSHIP
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "bib-chat-64027.firebaseapp.com",
            databaseURL: "https://bib-chat-64027-default-rtdb.firebaseio.com",
            projectId: "bib-chat-64027",
            storageBucket: "bib-chat-64027.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        const code = (params.get("code") || "").toUpperCase();

        const devNameEl = document.getElementById("dev-name");
        const devCodeEl = document.getElementById("dev-code");
        const devStatusEl = document.getElementById("dev-status");
        const approveBtn = document.getElementById("approve-btn");
        const rejectBtn = document.getElementById("reject-btn");

        let sessionData = null;

        async function initVerification() {
            if (!code) {
                alert("Отсутствует код подтверждения!");
                window.location.href = "qr-scan.html";
                return;
            }

            const sessionRef = ref(db, "qr_sessions/" + code);
            const snap = await get(sessionRef);

            if (!snap.exists()) {
                alert("Код не найден в базе! Вход запрещён.");
                window.location.href = "qr-scan.html";
                return;
            }

            sessionData = snap.val();
            if (sessionData.expiresAt && Date.now() > sessionData.expiresAt) {
                alert("Срок действия кода истёк!");
                window.location.href = "qr-scan.html";
                return;
            }

            devNameEl.textContent = sessionData.deviceName || "Другое устройство";
            devCodeEl.textContent = code;

            // Слушаем статус сессии в реальном времени
            onValue(sessionRef, (liveSnap) => {
                const live = liveSnap.val();
                if (!live) return;

                if (live.status === "approved") {
                    devStatusEl.textContent = "Подтверждено! Вход в профиль...";
                    if (live.uid) localStorage.setItem("kinship_uid", live.uid);
                    if (live.userName) localStorage.setItem("kinship_user_name", live.userName);
                    if (live.userHandle) localStorage.setItem("kinship_user_handle", live.userHandle);

                    setTimeout(() => {
                        window.location.href = "profile.html";
                    }, 600);
                } else if (live.status === "rejected") {
                    devStatusEl.textContent = "Отклонено";
                    setTimeout(() => {
                        window.location.href = "qr-scan.html";
                    }, 800);
                }
            });
        }

        approveBtn.addEventListener("click", async () => {
            if (!sessionData) return;
            approveBtn.disabled = true;

            const uid = localStorage.getItem("kinship_uid") || "default_user";
            const userName = localStorage.getItem("kinship_user_name") || "Пользователь Kinship";
            const userHandle = localStorage.getItem("kinship_user_handle") || "@kinship_user";

            await update(ref(db, "qr_sessions/" + code), {
                status: "approved",
                uid: uid,
                userName: userName,
                userHandle: userHandle,
                approvedAt: Date.now()
            });

            await push(ref(db, `users/${uid}/devices`), {
                deviceName: sessionData.deviceName || "Другое устройство",
                code: code,
                method: "QR / Код",
                loggedInAt: new Date().toLocaleString("ru-RU")
            });
        });

        rejectBtn.addEventListener("click", async () => {
            await update(ref(db, "qr_sessions/" + code), {
                status: "rejected"
            });
        });

        initVerification();
    </script>
</body>
</html>
